<title>My Stock Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#FAFAFD; --surface-3:#F0F1F7;
  --ink:#1A2036; --ink-soft:#3C4360; --muted:#6B7290; --line:#E3E5F0; --line-soft:#EEEFF7;
  --accent:#33409C; --accent-strong:#242B73; --accent-soft:#E9EAF9; --accent-ink:#FFFFFF;
  --good:#187A55; --good-soft:#E1F4EA; --warn:#A8650B; --warn-soft:#FBF0DA; --critical:#BC3A3A; --critical-soft:#FBE8E8; --info:#215F94; --info-soft:#E3EFF9;
  --shadow:0 1px 2px rgba(20,25,55,.06),0 10px 28px -14px rgba(20,25,55,.22);
  --radius:12px; --sans:'Public Sans',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  --cat-1:#0072B2; --cat-2:#E69F00; --cat-3:#009E73; --cat-4:#D55E00; --cat-5:#CC79A7; --cat-6:#56B4E9; --cat-7:#999999;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131C; --surface:#171B27; --surface-2:#1D2230; --surface-3:#242A3A;
    --ink:#E8EAF5; --ink-soft:#C7CBDE; --muted:#8991AC; --line:#2B3145; --line-soft:#232838;
    --accent:#8093EF; --accent-strong:#A2B0F5; --accent-soft:#252C4D; --accent-ink:#0D1020;
    --good:#4ED097; --good-soft:#153427; --warn:#EBAE4E; --warn-soft:#3B2C10; --critical:#F18686; --critical-soft:#3B1E20; --info:#7BB6EE; --info-soft:#182B40;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -14px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#10131C; --surface:#171B27; --surface-2:#1D2230; --surface-3:#242A3A;
  --ink:#E8EAF5; --ink-soft:#C7CBDE; --muted:#8991AC; --line:#2B3145; --line-soft:#232838;
  --accent:#8093EF; --accent-strong:#A2B0F5; --accent-soft:#252C4D; --accent-ink:#0D1020;
  --good:#4ED097; --good-soft:#153427; --warn:#EBAE4E; --warn-soft:#3B2C10; --critical:#F18686; --critical-soft:#3B1E20; --info:#7BB6EE; --info-soft:#182B40;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -14px rgba(0,0,0,.65);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;}
::selection{background:var(--accent-soft);}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
h1,h2,h3,h4{font-family:var(--sans);text-wrap:balance;margin:0;color:var(--ink);}
a{color:inherit;}
button{font-family:inherit;}
.icon{width:17px;height:17px;flex:0 0 auto;display:block;}
.icon-lg{width:22px;height:22px;}
.icon-sm{width:14px;height:14px;}

/* ---------- shell ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:232px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);
  position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:18px;z-index:50;
  transition:transform .22s ease;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:8px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-weight:800;font-size:15px;flex:0 0 auto;}
.brand-name{font-weight:800;font-size:14.5px;letter-spacing:-.01em;}
.brand-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.nav{flex:1;overflow-y:auto;padding:6px 10px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--ink-soft);text-decoration:none;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:2px;border:1px solid transparent;}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-strong);}
.nav-item .icon{color:inherit;opacity:.85;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:14px 12px 6px;font-weight:700;}
.sidebar-foot{padding:12px 18px 0;border-top:1px solid var(--line-soft);margin-top:8px;font-size:11.5px;color:var(--muted);}

.main{margin-left:232px;min-height:100vh;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 22px 12px;
}
.hamburger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:7px;color:var(--ink);cursor:pointer;}
.page-title{font-size:19px;font-weight:800;letter-spacing:-.01em;}
.page-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.topbar-spacer{flex:1;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px;color:var(--ink-soft);cursor:pointer;display:flex;}
.icon-btn:hover{background:var(--surface-2);}
.dot{position:absolute;top:-3px;right:-3px;background:var(--critical);color:#fff;font-size:9.5px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.content{padding:20px 22px 60px;max-width:1320px;width:100%;min-width:0;margin:0 auto;}
.overlay{position:fixed;inset:0;background:rgba(10,14,28,.45);z-index:45;display:none;}
.overlay.show{display:block;}

/* ---------- buttons / forms ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:8.5px 14px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{color:var(--critical);}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px;}
.btn-icon{padding:7px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
.field label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.field input,.field select,.field textarea{
  font:inherit;font-size:13.5px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
.field textarea{resize:vertical;min-height:64px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-hint{font-size:11.5px;color:var(--muted);}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-soft);}

/* ---------- cards / tiles ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
.card-pad{padding:16px 18px;}
.section{margin-bottom:22px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.section-title{font-size:15.5px;font-weight:800;}
.section-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:12px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:6px;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;}
.kpi-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.kpi-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.kpi-value{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;letter-spacing:-.01em;}
.kpi-sub{font-size:11.5px;color:var(--muted);}
.kpi-sub.good{color:var(--good);} .kpi-sub.warn{color:var(--warn);} .kpi-sub.critical{color:var(--critical);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-good{background:var(--good-soft);color:var(--good);}
.badge-warn{background:var(--warn-soft);color:var(--warn);}
.badge-critical{background:var(--critical-soft);color:var(--critical);}
.badge-info{background:var(--info-soft);color:var(--info);}
.badge-muted{background:var(--surface-3);color:var(--muted);}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;min-width:560px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface-2);}
.td-num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;}
th.td-num{text-align:right;}
.row-actions{display:flex;gap:5px;justify-content:flex-end;}
.empty-state{padding:44px 20px;text-align:center;color:var(--muted);}
.empty-state .icon{width:34px;height:34px;margin:0 auto 10px;opacity:.5;}
.table-toolbar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;flex:1;min-width:160px;max-width:320px;}
.search-box input{border:none;background:transparent;outline:none;font:inherit;color:var(--ink);width:100%;}
.search-box .icon{color:var(--muted);}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.pill-tab{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
.pill-tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(10,14,28,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;}
.modal{background:var(--surface);width:100%;max-width:640px;border-radius:16px;box-shadow:var(--shadow);margin:auto;}
.modal.modal-lg{max-width:880px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal-title{font-size:15.5px;font-weight:800;}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);}
.lines-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
.lines-table th{font-size:10.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:5px 6px;}
.lines-table td{padding:4px 6px;}
.lines-table input,.lines-table select{padding:6px 8px;font-size:13px;}
.line-total{font-family:var(--mono);font-size:13px;white-space:nowrap;}
.totals-box{margin-left:auto;width:260px;display:flex;flex-direction:column;gap:6px;}
.totals-row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);}
.totals-row.grand{font-size:16px;font-weight:800;color:var(--ink);border-top:1px solid var(--line);padding-top:8px;}
.totals-row .mono{font-variant-numeric:tabular-nums;}
.banner{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;flex-wrap:wrap;}
.banner-info{background:var(--info-soft);color:var(--info);}
.banner-warn{background:var(--warn-soft);color:var(--warn);}
.banner strong{font-weight:800;}
.banner .btn{margin-left:auto;flex:0 0 auto;}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:320px;}
:root:not([data-theme="light"]) .toast, [data-theme="dark"] .toast{}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
.two-col>*{min-width:0;}
.kpi-grid>*{min-width:0;}
@media (max-width:920px){.two-col{grid-template-columns:1fr;}}

/* ---------- charts ---------- */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:600;}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
.bar-label{font-size:10px;fill:var(--ink-soft);font-family:var(--mono);}
.axis-label{font-size:10px;fill:var(--muted);}
.grid-line{stroke:var(--line);stroke-width:1;}
#chart-tooltip{position:fixed;z-index:300;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:7px 10px;border-radius:8px;pointer-events:none;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap;}

/* ---------- invoice preview ---------- */
.invoice-frame-wrap{background:var(--surface-3);border-radius:10px;padding:10px;}
.invoice-frame-wrap iframe{width:100%;height:64vh;border:none;border-radius:6px;background:#fff;}

/* ---------- licence ---------- */
.license-screen{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-y:auto;}
.license-card{width:100%;max-width:460px;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 26px;}
.license-brand{display:flex;align-items:center;gap:11px;margin-bottom:18px;}
.license-card .field input{font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;}
.license-error{background:var(--critical-soft);color:var(--critical);border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px;}
.license-demo{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft);}
.license-demo-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.license-demo-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;}
.license-demo-item .mono{font-size:11.5px;}
.license-status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.license-key-row{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;flex-wrap:wrap;}
.license-key-row .mono{flex:1;min-width:150px;font-size:12.5px;}

@media (max-width:880px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  .content{padding:16px 14px 60px;}
  .field-row{grid-template-columns:1fr;}
  .two-col{grid-template-columns:1fr;}
}
</style>

<div id="chart-tooltip"></div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div id="license-gate" hidden></div>
<div id="app-root">
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">MS</div>
      <div>
        <div class="brand-name">My Stock Manager</div>
        <div class="brand-sub" id="brand-sub">Gestion de stock</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot">v1.0 &middot; <span id="mode-label">local</span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="hamburger" onclick="openSidebar()">${''}</button>
      <div>
        <div class="page-title" id="page-title">Tableau de bord</div>
        <div class="page-sub" id="page-sub"></div>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="icon-btn" title="Alertes de stock" onclick="navigate('reports');setReportTab('rupture')"></button>
        <button class="icon-btn" id="theme-btn" title="Basculer le thème"></button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
</div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
/* =========================================================================
   MY STOCK MANAGER — application de gestion de stock complète (mono-fichier)
   ========================================================================= */

/* ---------------------------- Icônes SVG ---------------------------- */
const ICONS = {
  dashboard:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>',

  users:'<circle cx="9" cy="8" r="3.1"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.3" cy="9" r="2.5"/><path d="M15.3 14.2c2.7.5 4.5 2.6 4.5 5.8"/>',
  cartDown:'<circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><path d="M12 4v6m0 0 2.3-2.3M12 10 9.7 7.7"/>',
  cartUp:'<circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><path d="M12 10V4m0 0-2.3 2.3M12 4l2.3 2.3"/>',
  receipt:'<path d="M5 2h14v19l-2.5-1.5L14 21l-2.5-1.5L9 21l-2.5-1.5L4 21V2Z"/><path d="M7.5 7h9M7.5 11h9M7.5 15h5"/>',
  arrows:'<path d="M7 3v13m0 0-3.5-3.5M7 16l3.5-3.5"/><path d="M17 21V8m0 0 3.5 3.5M17 8l-3.5 3.5"/>',
  clipboard:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M8.5 13l2.5 2.5L16 10"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9v.01M18 15v.01"/>',

function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return (crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function addDays(iso,n){ const d=new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function money(n){ n=Math.round(Number(n)||0); return new Intl.NumberFormat('fr-FR').format(n)+' '+ (state.settings.currency||'FCFA'); }
function num(n,dec){ return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:dec===undefined?2:dec}).format(Number(n)||0); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+ (iso.length<=10?'T00:00:00':'')); if(isNaN(d)) return '—'; return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—'; return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function monthKey(iso){ return (iso||'').slice(0,7); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function toast(msg,tone){
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  if(tone==='critical') el.style.background='var(--critical)';

  settings:{companyName:'Mon Entreprise',address:'',phone:'',email:'',taxId:'',currency:'FCFA',invoicePrefix:'FA',lowStockDefault:5,seeded:false,theme:'system'} };

/* ---------------------------- Backend (cloud db OU local) ---------------------------- */
function localLoad(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); COLLECTIONS.forEach(c=>{ state[c]=d[c]||[]; }); state.settings=Object.assign({},state.settings,d.settings||{}); return true; } }catch(e){} return false; }
function localSave(){ try{ const out={settings:state.settings}; COLLECTIONS.forEach(c=>out[c]=state[c]); localStorage.setItem(LS_KEY, JSON.stringify(out)); }catch(e){} }

const Backend = {
  async add(col,data){
    if(mode==='cloud'){ const ref = await dbApi.collection(col).add(data); return ref.id; }
    const id=uid(); state[col].push(Object.assign({id},data)); localSave(); scheduleRender(); return id;
  },
  async set(col,id,data){
    if(mode==='cloud'){ await dbApi.collection(col).doc(id).set(data); return; }
    const idx=state[col].findIndex(x=>x.id===id);
    if(idx>=0) state[col][idx]=Object.assign({id},data); else state[col].push(Object.assign({id},data));
    localSave(); scheduleRender();
  },
  async update(col,id,data){
    if(mode==='cloud'){ await dbApi.collection(col).doc(id).update(data); return; }
    const it=state[col].find(x=>x.id===id); if(it) Object.assign(it,data); localSave(); scheduleRender();
  },
  async remove(col,id){
    if(mode==='cloud'){ await dbApi.collection(col).doc(id).delete(); return; }
    state[col]=state[col].filter(x=>x.id!==id); localSave(); scheduleRender();
  },
  async saveSettings(patch){
    state.settings=Object.assign({},state.settings,patch);
    if(mode==='cloud'){ await dbApi.doc('settings/main').set(state.settings); return; }
    localSave(); scheduleRender();
  }
};

async function initBackend(){
  if(window.claude && typeof window.claude.use === 'function'){
    try{
      const db = await window.claude.use('db');
      const dl = await window.claude.use('downloads');
      if(db){
        dbApi=db; downloadsApi=dl; mode='cloud';
        document.getElementById('mode-label').textContent='en ligne';
        COLLECTIONS.forEach(col=>{
          dbApi.collection(col).onSnapshot(snap=>{
            state[col]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
            loadedOnce[col]=true;
            afterCollectionLoad();
            scheduleRender();
          }, err=>{ console.warn('db error',col,err); loadedOnce[col]=true; afterCollectionLoad(); });
        });
        dbApi.doc('settings/main').onSnapshot(snap=>{
          if(snap.exists) state.settings=Object.assign({},state.settings,snap.data());
          loadedOnce.settings=true; afterCollectionLoad(); scheduleRender();
        }, ()=>{ loadedOnce.settings=true; afterCollectionLoad(); });
        return;
      }
    }catch(e){ console.warn('claude db unavailable', e); }
  }
  // Mode local (hors claude.ai, ou capacité indisponible)
  mode='local';
  document.getElementById('mode-label').textContent='local (ce navigateur)';
  localLoad();
  bootDone=true;
  renderCurrent();
}
let allColsFlag=false;
function afterCollectionLoad(){
  if(allColsFlag) return;
  const all = COLLECTIONS.every(c=>loadedOnce[c]) && loadedOnce.settings;
  if(all){ allColsFlag=true; bootDone=true; renderCurrent(); }
}

/* ---------------------------- Licence logicielle ----------------------------
   Clés hors-ligne, préfixées MSM, encodant type + date d'émission + durée.
   Aucun serveur requis : la validité se vérifie par un simple code de contrôle.
   ⚠️ Le code étant exécuté côté client, un utilisateur averti peut lire cet
   algorithme dans la page — ce mécanisme dissuade un usage non autorisé
   occasionnel, ce n'est pas une protection anti-piratage inviolable.
------------------------------------------------------------------------- */
const LICENSE_PREFIX='MSM';
const LICENSE_EPOCH=Date.UTC(2020,0,1);
const LICENSE_TYPES={ M:{label:'Mensuelle',days:30}, A:{label:'Annuelle',days:365}, V:{label:'À vie',days:null} };
function lb36(n,len){ return n.toString(36).toUpperCase().padStart(len,'0'); }
function lunb36(s){ return parseInt(s,36); }
function licenseChecksum(payload){ let sum=0; for(let i=0;i<payload.length;i++){ sum=(sum*31+payload.charCodeAt(i))%1296; } return lb36(sum,2); }
function generateLicenseKey(typeCode, issuedDate){
  issuedDate = issuedDate || new Date();
  const daysSinceEpoch = Math.floor((Date.UTC(issuedDate.getFullYear(),issuedDate.getMonth(),issuedDate.getDate())-LICENSE_EPOCH)/86400000);
  const durationDays = LICENSE_TYPES[typeCode].days;
  const durCode = durationDays===null ? 'ZZZ' : lb36(durationDays,3);
  const salt = lb36(Math.floor(Math.random()*1296),2);
  const payload = typeCode + lb36(daysSinceEpoch,4) + durCode + salt;
  const raw = payload + licenseChecksum(payload);
  return LICENSE_PREFIX+'-'+raw.match(/.{1,4}/g).join('-');
}
function decodeLicenseKey(key){
  if(!key) return null;
  const cleaned=String(key).trim().toUpperCase().replace(/\s+/g,'');
  const parts=cleaned.split('-').filter(Boolean);
  if(parts[0]!==LICENSE_PREFIX) return null;
  const raw=parts.slice(1).join('');
  if(raw.length!==12) return null;
  const payload=raw.slice(0,10), checksum=raw.slice(10,12);
  if(licenseChecksum(payload)!==checksum) return null;
  const typeCode=payload[0];
  if(!LICENSE_TYPES[typeCode]) return null;
  const daysSinceEpoch=lunb36(payload.slice(1,5));
  const durCode=payload.slice(5,8);
  if(isNaN(daysSinceEpoch)) return null;
  const issuedMs=LICENSE_EPOCH+daysSinceEpoch*86400000;
  const issuedAt=new Date(issuedMs).toISOString().slice(0,10);
  let expiresAt=null;
  if(durCode!=='ZZZ'){ const durationDays=lunb36(durCode); if(isNaN(durationDays)) return null; expiresAt=new Date(issuedMs+durationDays*86400000).toISOString().slice(0,10); }
  return { key:LICENSE_PREFIX+'-'+parts.slice(1).join('-'), type:typeCode, typeLabel:LICENSE_TYPES[typeCode].label, issuedAt, expiresAt };
}
function licenseState(){
  const lic=state.settings.license;
  if(!lic || !lic.key) return {status:'none'};
  const decoded=decodeLicenseKey(lic.key);
  if(!decoded) return {status:'invalid'};
  if(decoded.expiresAt && decoded.expiresAt < todayISO()) return {status:'expired', decoded};
  return {status:'valid', decoded};
}
async function seedLicenseDemoKeys(){
  if(state.settings.licenseDemoSeeded) return;
  const list=['M','A','V'].map(t=>{ const key=generateLicenseKey(t); const d=decodeLicenseKey(key); return {key:d.key,type:d.type,typeLabel:d.typeLabel,issuedAt:d.issuedAt,expiresAt:d.expiresAt,generatedAt:nowISO()}; });
  await Backend.saveSettings({licenseDemoSeeded:true, licenseKeysIssued:list});
}
function renderLicenseGateIfNeeded(){
  const gate=document.getElementById('license-gate'), root=document.getElementById('app-root');
  const st=licenseState();
  if(st.status==='valid'){ gate.hidden=true; gate.innerHTML=''; root.style.display=''; return true; }
  root.style.display='none'; gate.hidden=false;
  gate.innerHTML = licenseGateHTML(st);
  return false;
}
function licenseGateHTML(st){
  let msg='';
  if(st.status==='expired') msg='<div class="license-error">'+icon('alert','icon-sm')+' Votre licence '+esc(st.decoded.typeLabel)+' a expiré le '+fmtDate(st.decoded.expiresAt)+'. Saisissez une nouvelle clé pour continuer.</div>';
  else if(st.status==='invalid') msg='<div class="license-error">'+icon('alert','icon-sm')+' La clé enregistrée est invalide. Saisissez une clé de licence valide.</div>';
  return '<div class="license-screen"><div class="license-card">'+
    '<div class="license-brand"><div class="brand-mark">MS</div><div><div class="brand-name">My Stock Manager</div><div class="brand-sub">Activation requise</div></div></div>'+
    msg+
    '<p class="field-hint" style="margin-bottom:14px">Entrez votre clé de licence pour accéder à l’application.</p>'+
    '<div class="field"><label>Clé de licence</label><input id="lic-key-input" placeholder="'+LICENSE_PREFIX+'-XXXX-XXXX-XXXX" onkeydown="if(event.key===\'Enter\')activateLicenseKey()"/></div>'+
    '<button class="btn btn-primary" style="width:100%;justify-content:center" onclick="activateLicenseKey()">'+icon('check','icon-sm')+'Activer</button>'+
    '<p class="field-hint" style="margin-top:14px;text-align:center">Vous n’avez pas de clé ? Contactez votre fournisseur.</p>'+
    '</div></div>';
}
async function activateLicenseKey(){
  const input=document.getElementById('lic-key-input');
  const decoded=decodeLicenseKey(input.value);
  if(!decoded){ input.value=input.value; renderGateError('Clé invalide. Vérifiez le format '+LICENSE_PREFIX+'-XXXX-XXXX-XXXX.'); return; }
  if(decoded.expiresAt && decoded.expiresAt < todayISO()){ renderGateError('Cette clé a expiré le '+fmtDate(decoded.expiresAt)+'.'); return; }
  await Backend.saveSettings({license:{key:decoded.key, activatedAt:nowISO()}});
  toast('Licence activée : '+decoded.typeLabel+'.','good');
  renderCurrent();
}
function renderGateError(text){
  const gate=document.getElementById('license-gate');
  const card=gate.querySelector('.license-card');
  let err=gate.querySelector('.license-error');
  if(!err){ err=document.createElement('div'); err.className='license-error'; card.insertBefore(err, card.children[1]); }
  err.innerHTML = icon('alert','icon-sm')+' '+esc(text);
}
async function generateNewLicenseKey(){
  const type=document.getElementById('lic-gen-type').value;
  const key=generateLicenseKey(type); const d=decodeLicenseKey(key);
  const list=[{key:d.key,type:d.type,typeLabel:d.typeLabel,issuedAt:d.issuedAt,expiresAt:d.expiresAt,generatedAt:nowISO()}, ...(state.settings.licenseKeysIssued||[])].slice(0,30);
  await Backend.saveSettings({licenseKeysIssued:list});
  toast('Nouvelle clé '+d.typeLabel.toLowerCase()+' générée.','good');
}
function copyLicenseKey(key,btn){
  const done=()=>{ const old=btn.textContent; btn.textContent='Copié !'; setTimeout(()=>{ btn.textContent=old; },1500); };
  try{ navigator.clipboard.writeText(key).then(done).catch(()=>fallbackCopy(key,done)); }catch(e){ fallbackCopy(key,done); }
}
function fallbackCopy(text,cb){
  try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); cb&&cb(); }catch(e){ toast('Copie manuelle requise : '+text); }
}
async function deactivateLicense(){
  if(!confirm('Verrouiller à nouveau l’application et exiger une nouvelle clé de licence ?')) return;
  await Backend.saveSettings({license:null});
  renderCurrent();
}

/* ---------------------------- Export Excel ---------------------------- */
async function exportToExcel(filename, headers, rows){
  if(typeof XLSX === 'undefined'){ toast('Bibliothèque Excel indisponible pour le moment.','critical'); return; }
  const ws = XLSX.utils.json_to_sheet(rows, {header:headers});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Feuille1');
  const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  await offerDownload(filename, blob);
}
async function offerDownload(filename, blob){
  try{
    if(mode==='cloud' && downloadsApi){
      const res = await downloadsApi.save({filename, data:blob});
      toast(res.status==='saved' ? 'Fichier enregistré.' : 'Fichier transmis.', 'good');
      return;
    }
  }catch(e){
    if(e && e.code==='declined'){ return; }
    console.warn('downloads api failed, fallback', e);
  }
  // Repli local (mode hors claude.ai) : téléchargement navigateur classique
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('Fichier téléchargé.','good');
  }catch(e2){ toast('Impossible de générer le fichier.','critical'); }
}

/* ---- Graphique : ventes vs achats sur 6 mois ---- */
function last6Months(){
  const out=[]; const d=new Date();
  d.setDate(1);
  for(let i=5;i>=0;i--){ const dd=new Date(d.getFullYear(),d.getMonth()-i,1); out.push({key:dd.toISOString().slice(0,7), label:dd.toLocaleDateString('fr-FR',{month:'short'})}); }
  return out;
}
function salesVsPurchasesChart(){
  const months=last6Months();
  const sales=months.map(m=>state.sales.filter(s=>monthKey(s.date)===m.key).reduce((s,x)=>s+Number(x.total||0),0));
  const purch=months.map(m=>state.purchases.filter(p=>monthKey(p.date)===m.key).reduce((s,x)=>s+Number(x.total||0),0));
  const max=Math.max(1,...sales,...purch);
  const W=560,H=230, padL=54, padB=28, padT=10, padR=10;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const groupW=plotW/months.length; const barW=Math.min(22, groupW/2.6-4);
  const yTicks=4;
  let gridSvg='', labelsSvg='';
  for(let t=0;t<=yTicks;t++){ const val=max*t/yTicks; const y=padT+plotH-(plotH*t/yTicks);
    gridSvg+='<line class="grid-line" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>';
    labelsSvg+='<text class="axis-label" x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end">'+formatCompact(val)+'</text>';
  }
  let bars='';
  months.forEach((m,i)=>{
    const gx=padL+i*groupW;
    const hS=(sales[i]/max)*plotH, hP=(purch[i]/max)*plotH;
    const x1=gx+groupW/2-barW-2, x2=gx+groupW/2+2;
    bars+='<rect data-tip="Ventes '+m.label+' : '+money(sales[i])+'" x="'+x1+'" y="'+(padT+plotH-hS)+'" width="'+barW+'" height="'+Math.max(hS,1)+'" rx="3" fill="var(--cat-1)"/>';
    bars+='<rect data-tip="Achats '+m.label+' : '+money(purch[i])+'" x="'+x2+'" y="'+(padT+plotH-hP)+'" width="'+barW+'" height="'+Math.max(hP,1)+'" rx="3" fill="var(--cat-2)"/>';
    labelsSvg+='<text class="axis-label" x="'+(gx+groupW/2)+'" y="'+(H-8)+'" text-anchor="middle">'+m.label+'</text>';
  });
  return '<div class="chart-card"><div class="chart-head"><h3 class="section-title">Ventes vs achats (6 derniers mois)</h3>'+
    '<div class="legend"><span class="legend-item"><span class="legend-swatch" style="background:var(--cat-1)"></span>Ventes</span>'+
    '<span class="legend-item"><span class="legend-swatch" style="background:var(--cat-2)"></span>Achats</span></div></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+gridSvg+bars+labelsSvg+'</svg></div>';
}
function formatCompact(n){ if(n>=1000000) return num(n/1000000,1)+'M'; if(n>=1000) return num(n/1000,0)+'k'; return num(n,0); }

/* ---- Graphique : répartition de la valeur du stock par catégorie ---- */
function stockByCategoryChart(){
  const palette=['var(--cat-1)','var(--cat-2)','var(--cat-3)','var(--cat-4)','var(--cat-5)','var(--cat-6)'];
  const byCat={};
  state.products.forEach(p=>{ const key=p.categoryId||'none'; byCat[key]=(byCat[key]||0)+stockValue(p); });
  let entries=Object.entries(byCat).map(([id,val])=>({id,val,label: id==='none'?'Sans catégorie':displayName('categories',id,'—')}));
  entries.sort((a,b)=>b.val-a.val);
  let shown=entries.slice(0,6), rest=entries.slice(6);
  if(rest.length){ shown.push({id:'other',label:'Autres',val:rest.reduce((s,x)=>s+x.val,0)}); }
  const total=shown.reduce((s,x)=>s+x.val,0);
  const divisor=total||1;
  const W=560,H=230, padL=10, padT=10, rowH=28, barMaxW=300;
  let rows='';
  shown.forEach((e,i)=>{
    const color = e.id==='other' ? 'var(--cat-7)' : palette[i%palette.length];
    const w = (e.val/divisor)*barMaxW;
    const y = padT+i*rowH;
    rows+='<text class="bar-label" x="'+padL+'" y="'+(y+13)+'" font-family="var(--sans)" fill="var(--ink-soft)" font-weight="600">'+esc(e.label)+'</text>';
    rows+='<rect data-tip="'+esc(e.label)+' : '+money(e.val)+' ('+num(e.val/divisor*100,0)+'%)" x="150" y="'+(y+2)+'" width="'+Math.max(w,2)+'" height="16" rx="4" fill="'+color+'"/>';
    rows+='<text class="bar-label" x="'+(150+barMaxW+10)+'" y="'+(y+13)+'">'+formatCompact(e.val)+'</text>';
  });
  const H2 = padT + shown.length*rowH + 10;
  return '<div class="chart-card"><div class="chart-head"><h3 class="section-title">Valeur du stock par catégorie</h3>'+
    '<div class="legend"><span class="legend-item">Total : '+money(total)+'</span></div></div>'+
    (shown.length? '<svg viewBox="0 0 '+W+' '+H2+'" style="width:100%;height:auto">'+rows+'</svg>' : '<div class="empty-state">'+icon('box','icon-lg')+'<div>Aucun produit en stock.</div></div>') +
    '</div>';
}

    minStock:Number(document.getElementById('f-min').value)||0,
  };
  if(!data.name){ toast('Le nom du produit est requis.','critical'); return; }
  if(id){ await Backend.update('products',id,data); toast('Produit mis à jour.','good'); }
  else{ data.stock=Number(document.getElementById('f-stock').value)||0; data.createdAt=nowISO(); const newId=await Backend.add('products',data);

    toast('Produit créé.','good'); }

let lineDraft=[];
function lineEditorHTML(priceField){
  const prodOpts = state.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');
  return '<table class="lines-table"><thead><tr><th style="width:38%">Produit</th><th>Qté</th><th>'+(priceField==='unitCost'?'Coût unit.':'Prix unit.')+'</th><th>Total</th><th></th></tr></thead>'+
    '<tbody id="lines-body">'+lineDraft.map((l,i)=>lineRowHTML(l,i,prodOpts,priceField)).join('')+'</tbody></table>'+
    '<button class="btn btn-sm" type="button" onclick="addLineDraftRow(\''+priceField+'\')">'+icon('plus','icon-sm')+'Ajouter une ligne</button>';
}
function lineRowHTML(l,i,prodOpts,priceField){
  return '<tr><td><select onchange="updateLineDraft('+i+',\'productId\',this.value,\''+priceField+'\')">'+
      '<option value="">— Choisir —</option>'+prodOpts.replace('value="'+l.productId+'"','value="'+l.productId+'" selected')+'</select></td>'+
    '<td><input type="number" min="0" style="width:70px" value="'+esc(l.qty)+'" onchange="updateLineDraft('+i+',\'qty\',this.value)"/></td>'+
    '<td><input type="number" min="0" style="width:90px" value="'+esc(l[priceField])+'" onchange="updateLineDraft('+i+',\''+priceField+'\',this.value)"/></td>'+
    '<td class="line-total">'+money((Number(l.qty)||0)*(Number(l[priceField])||0))+'</td>'+
    '<td><button class="btn btn-sm btn-icon btn-danger" type="button" onclick="removeLineDraftRow('+i+')">'+icon('x','icon-sm')+'</button></td></tr>';
}
function addLineDraftRow(priceField){ lineDraft.push({productId:'',qty:1,[priceField]:0}); refreshLineEditor(priceField); }
function removeLineDraftRow(i){ lineDraft.splice(i,1); refreshLineEditor(window.__priceField); }
function updateLineDraft(i,field,value,priceField){
  if(priceField) window.__priceField=priceField;
  if(field==='productId'){ const p=byId(state.products,value); lineDraft[i].productId=value; lineDraft[i].name=p?p.name:'';
    if(window.__priceField==='unitCost') lineDraft[i].unitCost = p? p.purchasePrice : 0; else lineDraft[i].unitPrice = p? p.salePrice : 0;
  } else { lineDraft[i][field]=Number(value)||0; }
  refreshLineEditor(window.__priceField);
}
function refreshLineEditor(priceField){
  const prodOpts = state.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');
  document.getElementById('lines-body').innerHTML = lineDraft.map((l,i)=>lineRowHTML(l,i,prodOpts,priceField)).join('');
  const totalEl=document.getElementById('lines-grand-total');
  if(totalEl) totalEl.textContent = money(lineDraft.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l[priceField])||0),0));
}

async function savePurchase(){
  const supplierId=document.getElementById('f-supplier').value;
  const date=document.getElementById('f-date').value||todayISO();
  const status=document.getElementById('f-status').value;
  const amountPaid=Number(document.getElementById('f-paid').value)||0;
  const lines=lineDraft.filter(l=>l.productId && l.qty>0);
  if(!supplierId){ toast('Choisissez un fournisseur.','critical'); return; }
  if(!lines.length){ toast('Ajoutez au moins un article.','critical'); return; }
  const total=lines.reduce((s,l)=>s+l.qty*l.unitCost,0);
  const id=await Backend.add('purchases',{supplierId,date,status,lines,total,amountPaid,createdAt:nowISO(), receivedAt: status==='recu'?nowISO():null});
  if(status==='recu'){ for(const l of lines) await applyStockDelta(l.productId,l.qty,'entree','Achat fournisseur','purchase',id,date); }
  if(amountPaid>0) await Backend.add('cashtx',{type:'decaissement',amount:amountPaid,category:'Achat',description:'Paiement achat '+displayName('suppliers',supplierId,'—'),date,refType:'purchase',refId:id,createdAt:nowISO()});
  toast('Achat enregistré.','good'); closeModal();
}
async function applyStockDelta(productId,qty,type,reason,refType,refId,date){
  const p=byId(state.products,productId); if(!p) return;
  const newStock = type==='entree' ? Number(p.stock||0)+Number(qty) : Number(p.stock||0)-Number(qty);
  await Backend.update('products',productId,{stock:newStock});
  await Backend.add('movements',{productId,type,qty:Math.abs(qty),reason,refType,refId,date:date||todayISO(),stockAfter:newStock,createdAt:nowISO()});
}
async function receivePurchase(id){
  const p=byId(state.purchases,id); if(!p||p.status==='recu') return;
  for(const l of p.lines) await applyStockDelta(l.productId,l.qty,'entree','Réception achat','purchase',id,todayISO());
  await Backend.update('purchases',id,{status:'recu',receivedAt:nowISO()});
  toast('Achat marqué comme reçu, stock mis à jour.','good');
}
async function payPurchase(id){
  const p=byId(state.purchases,id); const due=Number(p.total||0)-Number(p.amountPaid||0);
  const amt=Number(prompt('Montant encaissé par le fournisseur (reste dû : '+money(due)+') :', due));
  if(!amt || amt<=0) return;
  await Backend.update('purchases',id,{amountPaid:Number(p.amountPaid||0)+amt});
  await Backend.add('cashtx',{type:'decaissement',amount:amt,category:'Achat',description:'Paiement achat '+displayName('suppliers',p.supplierId,'—'),date:todayISO(),refType:'purchase',refId:id,createdAt:nowISO()});
  toast('Paiement enregistré.','good');
}

async function saveStandaloneInvoice(){
  const customerId=document.getElementById('f-customer').value;
  const date=document.getElementById('f-date').value||todayISO();
  const dueDate=document.getElementById('f-due').value||addDays(date,30);
  const lines=lineDraft.filter(l=>l.productId && l.qty>0);
  if(!lines.length){ toast('Ajoutez au moins un article.','critical'); return; }
  for(const l of lines){ const p=byId(state.products,l.productId); if(p && l.qty>p.stock){ if(!confirm('Stock insuffisant pour '+p.name+' (disponible : '+p.stock+'). Continuer quand même ?')) return; } }
  const total=lines.reduce((s,l)=>s+l.qty*l.unitPrice,0);
  const number=nextInvoiceNumber();
  // Une facture autonome crée aussi la vente correspondante : le stock est décrémenté
  // et le chiffre d'affaires (tableau de bord, comptabilité) reflète bien la facture.
  const saleId=await Backend.add('sales',{customerId,date,lines,total,amountPaid:0,createdAt:nowISO()});
  for(const l of lines) await applyStockDelta(l.productId,l.qty,'sortie','Vente (facture)','sale',saleId,date);
  await Backend.add('invoices',{saleId,number,date,dueDate,customerId,lines,total,amountPaid:0,createdAt:nowISO()});
  await Backend.saveSettings({invoiceCounter:(state.settings.invoiceCounter||state.invoices.length)+1});
  toast('Facture créée, stock mis à jour.','good'); closeModal();
}
async function payInvoice(id){
  const i=byId(state.invoices,id); const due=Number(i.total||0)-Number(i.amountPaid||0);
  const amt=Number(prompt('Montant encaissé (reste dû : '+money(due)+') :', due));
  if(!amt || amt<=0) return;
  const newPaid=Number(i.amountPaid||0)+amt;
  await Backend.update('invoices',id,{amountPaid:newPaid});
  if(i.saleId){ const s=byId(state.sales,i.saleId); if(s) await Backend.update('sales',i.saleId,{amountPaid:Number(s.amountPaid||0)+amt}); }
  await Backend.add('cashtx',{type:'encaissement',amount:amt,category:'Vente',description:'Encaissement facture '+i.number,date:todayISO(),refType:'invoice',refId:id,createdAt:nowISO()});
  toast('Paiement encaissé.','good');
}

/* ---- Génération PDF facture ---- */
function buildInvoicePdf(inv){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm',format:'a4'});
  const set=state.settings;
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(30,35,60);
  doc.text(set.companyName||'Mon Entreprise', 14, 20);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(90,95,120);
  let y=26;
  [set.address, set.phone, set.email, set.taxId?('NIF : '+set.taxId):''].filter(Boolean).forEach(line=>{ doc.text(line,14,y); y+=4.5; });

  doc.setFontSize(20); doc.setTextColor(51,64,156); doc.setFont('helvetica','bold');
  doc.text('FACTURE', 196, 20, {align:'right'});
  doc.setFontSize(10); doc.setTextColor(60,64,90); doc.setFont('helvetica','normal');
  doc.text('N° '+inv.number, 196, 27, {align:'right'});
  doc.text('Date : '+fmtDate(inv.date), 196, 32, {align:'right'});
  if(inv.dueDate) doc.text('Échéance : '+fmtDate(inv.dueDate), 196, 37, {align:'right'});

  doc.setDrawColor(225,227,240); doc.line(14,44,196,44);
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(30,35,60);
  doc.text('Facturé à', 14, 52);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  const cust = inv.customerId ? byId(state.customers,inv.customerId) : null;
  doc.text(cust ? cust.name : 'Client comptoir', 14, 58);
  let cy=63; if(cust){ [cust.address,cust.phone,cust.email].filter(Boolean).forEach(l=>{ doc.text(l,14,cy); cy+=5; }); }

  const body = inv.lines.map(l=>[l.name||displayName('products',l.productId,'—'), num(l.qty,0), money(l.unitPrice), money(l.qty*l.unitPrice)]);
  doc.autoTable({
    startY:72, head:[['Désignation','Qté','Prix unitaire','Montant']], body,
    styles:{font:'helvetica',fontSize:9.5,textColor:[40,45,65],cellPadding:3},
    headStyles:{fillColor:[51,64,156],textColor:255,fontStyle:'bold'},
    alternateRowStyles:{fillColor:[247,248,252]},
    columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'}},
    margin:{left:14,right:14}
  });
  let ny = doc.lastAutoTable.finalY + 8;
  const total=Number(inv.total||0), paid=Number(inv.amountPaid||0), due=total-paid;
  doc.setFontSize(10);
  doc.text('Total TTC', 150, ny); doc.text(money(total), 196, ny, {align:'right'}); ny+=6;
  doc.text('Montant payé', 150, ny); doc.text(money(paid), 196, ny, {align:'right'}); ny+=6;
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Reste à payer', 150, ny); doc.text(money(due), 196, ny, {align:'right'});

  const st=invoiceStatus(inv); const stLabel = st==='payee'?'PAYÉE':st==='partielle'?'PARTIELLEMENT PAYÉE':'IMPAYÉE';
  const stColor = st==='payee'?[24,122,85]:st==='partielle'?[168,101,11]:[188,58,58];
  doc.setTextColor(...stColor); doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text(stLabel, 14, ny);

  doc.setTextColor(140,144,165); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  doc.text('Merci pour votre confiance. Facture générée par My Stock Manager.', 14, 286);
  return doc;
}

  const inv=byId(state.invoices,id);
  if(typeof window.jspdf==='undefined'){ toast('Bibliothèque PDF indisponible.','critical'); return; }

  const blob=doc.output('blob');

async function saveMovement(){
  const productId=document.getElementById('f-product').value;
  const type=document.getElementById('f-type').value;
  const qty=Number(document.getElementById('f-qty').value)||0;
  const reason=document.getElementById('f-reason').value.trim()||'Ajustement manuel';
  const date=document.getElementById('f-date').value||todayISO();
  if(!productId || qty===0){ toast('Renseignez un produit et une quantité.','critical'); return; }
  const p=byId(state.products,productId);
  let newStock;
  if(type==='entree') newStock=Number(p.stock||0)+qty;
  else if(type==='sortie') newStock=Number(p.stock||0)-qty;
  else newStock=Number(p.stock||0)+qty;
  await Backend.update('products',productId,{stock:newStock});
  await Backend.add('movements',{productId,type,qty:type==='ajustement'?qty:Math.abs(qty),reason,date,stockAfter:newStock,createdAt:nowISO()});
  toast('Mouvement enregistré.','good'); closeModal();
}

let acctPeriod='month';
function periodRange(p){
  const now=new Date(); let start;
  if(p==='month'){ start=new Date(now.getFullYear(),now.getMonth(),1); }
  else if(p==='quarter'){ start=new Date(now.getFullYear(),now.getMonth()-2,1); }
  else { start=new Date(now.getFullYear(),0,1); }
  return {start:start.toISOString().slice(0,10), end:todayISO()};
}
function renderAccounting(){
  const {start,end}=periodRange(acctPeriod);
  const inRange=d=> d>=start && d<=end;
  const revenueSales=state.sales.filter(s=>inRange(s.date)).reduce((s,x)=>s+Number(x.total||0),0);
  const revenueOther=state.cashtx.filter(t=>t.type==='encaissement' && !t.refId && inRange(t.date)).reduce((s,t)=>s+Number(t.amount||0),0);
  const chargesPurchases=state.purchases.filter(p=>inRange(p.date)).reduce((s,x)=>s+Number(x.total||0),0);
  const chargesOther=state.cashtx.filter(t=>t.type==='decaissement' && !t.refId && inRange(t.date)).reduce((s,t)=>s+Number(t.amount||0),0);
  const produits=revenueSales+revenueOther, charges=chargesPurchases+chargesOther, resultat=produits-charges;

  const journal=[
    ...state.sales.filter(s=>inRange(s.date)).map(s=>({date:s.date,label:'Vente — '+(displayName('customers',s.customerId,'Comptoir')),credit:s.total,debit:0})),
    ...state.purchases.filter(p=>inRange(p.date)).map(p=>({date:p.date,label:'Achat — '+displayName('suppliers',p.supplierId,'—'),credit:0,debit:p.total})),
    ...state.cashtx.filter(t=>!t.refId && inRange(t.date)).map(t=>({date:t.date,label:(t.category||'Opération')+(t.description?' — '+t.description:''),credit:t.type==='encaissement'?t.amount:0,debit:t.type==='decaissement'?t.amount:0}))
  ].sort((a,b)=>a.date.localeCompare(b.date));

  return '<div class="banner banner-info">'+icon('alert','icon-sm')+'<div>Vue comptable <strong>simplifiée</strong> (recettes / dépenses), à titre de suivi de gestion — elle ne remplace pas une comptabilité tenue par un professionnel.</div></div>'+
    '<div class="pill-tabs section">'+['month','quarter','year'].map(p=>'<button class="pill-tab '+(acctPeriod===p?'active':'')+'" onclick="acctPeriod=\''+p+'\';renderCurrent()">'+(p==='month'?'Ce mois':p==='quarter'?'3 derniers mois':'Cette année')+'</button>').join('')+'</div>'+
    '<div class="kpi-grid section">'+
      kpiTile('Produits (recettes)', money(produits), 'Ventes : '+money(revenueSales), 'cartUp','good')+
      kpiTile('Charges (dépenses)', money(charges), 'Achats : '+money(chargesPurchases), 'cartDown','warn')+
      kpiTile('Résultat net', money(resultat), resultat>=0?'Bénéfice':'Déficit', 'calculator', resultat>=0?'good':'critical')+
    '</div>'+
    '<div class="section-head"><div class="section-title">Journal des opérations</div></div>'+
    '<div class="table-wrap">'+(journal.length? '<table><thead><tr><th>Date</th><th>Libellé</th><th class="td-num">Débit</th><th class="td-num">Crédit</th></tr></thead><tbody>'+
      journal.map(j=>'<tr><td>'+fmtDate(j.date)+'</td><td>'+esc(j.label)+'</td><td class="td-num">'+(j.debit?money(j.debit):'—')+'</td><td class="td-num">'+(j.credit?money(j.credit):'—')+'</td></tr>').join('')+
      '</tbody></table>' : emptyRow('Aucune opération sur la période.','calculator')) + '</div>';
}

/* =========================================================================
   RAPPORTS
   ========================================================================= */
let reportTab='stock';
function setReportTab(t){ reportTab=t; navigate('reports'); renderCurrent(); }
function renderReports(){
  const tabs=[['stock','Valeur du stock'],['rupture','Ruptures de stock'],['ventes','Ventes'],['achats','Achats'],['impayes','Factures impayées']];
  return '<div class="pill-tabs section">'+tabs.map(([k,l])=>'<button class="pill-tab '+(reportTab===k?'active':'')+'" onclick="reportTab=\''+k+'\';renderCurrent()">'+l+'</button>').join('')+'</div>'+
    (reportTab==='stock'?reportStock():reportTab==='rupture'?reportRupture():reportTab==='ventes'?reportVentes():reportTab==='achats'?reportAchats():reportImpayes());
}
function reportStock(){
  const rows=state.products.map(p=>({'Produit':p.name,'Catégorie':displayName('categories',p.categoryId,'—'),'Stock':p.stock,'Prix achat':p.purchasePrice,'Valeur':stockValue(p)}));
  const total=rows.reduce((s,r)=>s+r.Valeur,0);
  return reportTable(rows,['Produit','Catégorie','Stock','Prix achat','Valeur'],'valeur_stock.xlsx','Valeur totale du stock : '+money(total));
}
function reportRupture(){
  const rows=lowStockProducts().map(p=>({'Produit':p.name,'Catégorie':displayName('categories',p.categoryId,'—'),'Stock':p.stock,'Seuil':p.minStock,'Manquant':Math.max(0,p.minStock-p.stock)}));
  return reportTable(rows,['Produit','Catégorie','Stock','Seuil','Manquant'],'ruptures_stock.xlsx',rows.length+' produit(s) sous le seuil minimum');
}
function reportVentes(){
  const rows=state.sales.map(s=>({'Date':fmtDate(s.date),'Client':displayName('customers',s.customerId,'Comptoir'),'Montant':s.total,'Payé':s.amountPaid}));
  const total=state.sales.reduce((s,x)=>s+Number(x.total||0),0);
  return reportTable(rows,['Date','Client','Montant','Payé'],'ventes.xlsx','Chiffre d’affaires total : '+money(total));
}
function reportAchats(){
  const rows=state.purchases.map(p=>({'Date':fmtDate(p.date),'Fournisseur':displayName('suppliers',p.supplierId,'—'),'Montant':p.total,'Payé':p.amountPaid,'Statut':purchaseStatusLabel(p)}));
  const total=state.purchases.reduce((s,x)=>s+Number(x.total||0),0);
  return reportTable(rows,['Date','Fournisseur','Montant','Payé','Statut'],'achats.xlsx','Total des achats : '+money(total));
}
function reportImpayes(){
  const rows=state.invoices.filter(i=>invoiceStatus(i)!=='payee').map(i=>({'N°':i.number,'Date':fmtDate(i.date),'Client':displayName('customers',i.customerId,'Comptoir'),'Total':i.total,'Payé':i.amountPaid,'Reste dû':i.total-i.amountPaid}));
  const total=rows.reduce((s,r)=>s+r['Reste dû'],0);
  return reportTable(rows,['N°','Date','Client','Total','Payé','Reste dû'],'factures_impayees.xlsx','Total à recouvrer : '+money(total));
}
function reportTable(rows,headers,filename,summary){
  return '<div class="section-head"><div class="section-title">'+esc(summary)+'</div>'+
    '<div class="section-actions"><button class="btn" onclick=\'exportToExcel("'+filename+'",'+JSON.stringify(headers)+','+JSON.stringify(rows).replace(/'/g,"&#39;")+')\'>'+icon('download','icon-sm')+'Exporter Excel</button></div></div>'+
    '<div class="table-wrap">'+(rows.length? '<table><thead><tr>'+headers.map(h=>'<th class="'+(typeof rows[0][h]==='number'?'td-num':'')+'">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+
      rows.map(r=>'<tr>'+headers.map(h=>'<td class="'+(typeof r[h]==='number'?'td-num':'')+'">'+(typeof r[h]==='number'?(h.toLowerCase().includes('stock')||h==='Manquant'||h==='Seuil'?num(r[h],0):money(r[h])):esc(r[h]))+'</td>').join('')+'</tr>').join('')+
      '</tbody></table>' : emptyRow('Aucune donnée pour ce rapport.','chart')) + '</div>';
}

function renderSettings(){
  const s=state.settings;
  return '<div class="two-col">'+
    '<div class="card card-pad">'+
      '<div class="section-title" style="margin-bottom:14px">'+icon('building','icon-sm')+' Informations de l’entreprise</div>'+
      '<div class="field"><label>Nom de l’entreprise</label><input id="s-name" value="'+esc(s.companyName)+'"/></div>'+
      '<div class="field"><label>Adresse</label><input id="s-address" value="'+esc(s.address||'')+'"/></div>'+
      '<div class="field-row"><div class="field"><label>Téléphone</label><input id="s-phone" value="'+esc(s.phone||'')+'"/></div>'+
      '<div class="field"><label>Email</label><input id="s-email" value="'+esc(s.email||'')+'"/></div></div>'+
      '<div class="field"><label>NIF / Identifiant fiscal</label><input id="s-taxid" value="'+esc(s.taxId||'')+'"/></div>'+
      '<button class="btn btn-primary" onclick="saveCompanySettings()">Enregistrer</button>'+
    '</div>'+
    '<div class="card card-pad">'+
      '<div class="section-title" style="margin-bottom:14px">Facturation & préférences</div>'+
      '<div class="field-row"><div class="field"><label>Devise</label><input id="s-currency" value="'+esc(s.currency||'FCFA')+'"/></div>'+
      '<div class="field"><label>Préfixe des factures</label><input id="s-prefix" value="'+esc(s.invoicePrefix||'FA')+'"/></div></div>'+
      '<div class="field"><label>Seuil de stock minimum par défaut</label><input id="s-minstock" type="number" value="'+esc(s.lowStockDefault||5)+'"/></div>'+
      '<button class="btn btn-primary" onclick="savePrefsSettings()">Enregistrer</button>'+
    '</div>'+
  '</div>'+
  renderLicenseSettingsCard();
}
function renderLicenseSettingsCard(){
  const st=licenseState();
  const badge = st.status==='valid' ? (st.decoded.expiresAt && st.decoded.expiresAt<=addDays(todayISO(),7) ? 'badge-warn' : 'badge-good') : 'badge-critical';
  const label = st.status==='valid' ? (st.decoded.expiresAt ? 'Active — expire le '+fmtDate(st.decoded.expiresAt) : 'Active — à vie') : st.status==='expired' ? 'Expirée' : 'Aucune licence';
  return '<div class="card card-pad section">'+
    '<div class="section-head"><div class="section-title">'+icon('receipt','icon-sm')+' Licence logicielle</div>'+
    '<span class="license-status-badge '+badge+'" style="background:var('+(st.status==='valid'?(badge==='badge-warn'?'--warn-soft':'--good-soft'):'--critical-soft')+');color:var('+(st.status==='valid'?(badge==='badge-warn'?'--warn':'--good'):'--critical')+')">'+esc(label)+'</span></div>'+
    (st.status==='valid' ? '<p class="field-hint" style="margin-bottom:12px">Clé active : <span class="mono">'+esc(st.decoded.key)+'</span> &middot; type '+esc(st.decoded.typeLabel)+' &middot; activée le '+fmtDate(state.settings.license.activatedAt)+'</p>'+
      '<button class="btn btn-sm btn-danger" onclick="deactivateLicense()" style="margin-bottom:18px">Verrouiller / changer de clé</button>' : '')+
    '<div class="field-row"><div class="field" style="flex:1"><label>Activer une autre clé</label><input id="s-lic-key" placeholder="'+LICENSE_PREFIX+'-XXXX-XXXX-XXXX"/></div></div>'+
    '<button class="btn" onclick="activateLicenseFromSettings()">Activer cette clé</button>'+
  '</div>';
}
async function activateLicenseFromSettings(){
  const raw=document.getElementById('s-lic-key').value;
  const decoded=decodeLicenseKey(raw);
  if(!decoded){ toast('Clé invalide.','critical'); return; }
  if(decoded.expiresAt && decoded.expiresAt < todayISO()){ toast('Cette clé a expiré le '+fmtDate(decoded.expiresAt)+'.','critical'); return; }
  await Backend.saveSettings({license:{key:decoded.key, activatedAt:nowISO()}});
  toast('Licence activée : '+decoded.typeLabel+'.','good');
}
async function saveCompanySettings(){
  await Backend.saveSettings({companyName:document.getElementById('s-name').value.trim()||'Mon Entreprise',address:document.getElementById('s-address').value.trim(),
    phone:document.getElementById('s-phone').value.trim(),email:document.getElementById('s-email').value.trim(),taxId:document.getElementById('s-taxid').value.trim()});
  toast('Informations enregistrées.','good');
}
async function savePrefsSettings(){
  await Backend.saveSettings({currency:document.getElementById('s-currency').value.trim()||'FCFA',invoicePrefix:document.getElementById('s-prefix').value.trim()||'FA',
    lowStockDefault:Number(document.getElementById('s-minstock').value)||5});
  toast('Préférences enregistrées.','good');
}

/* =========================================================================
   THÈME & DÉMARRAGE
   ========================================================================= */
function applyThemeButton(){
  const cur = document.documentElement.getAttribute('data-theme');
  document.getElementById('theme-btn').innerHTML = icon(cur==='dark' ? 'sun' : 'moon');
}
document.getElementById('theme-btn').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : (cur==='light' ? null : 'dark');
  if(next) document.documentElement.setAttribute('data-theme',next); else document.documentElement.removeAttribute('data-theme');
  applyThemeButton();
});
applyThemeButton();

buildNav();
renderCurrent();
initBackend();
</script>
