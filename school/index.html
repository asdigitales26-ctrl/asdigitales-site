<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>My School Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy-950:#0f1e30;
  --navy-900:#152c47;
  --navy-800:#1e3a5f;
  --navy-700:#2a4d78;
  --navy-100:#e7edf5;
  --gold-600:#a9821c;
  --gold-500:#c9a227;
  --gold-100:#f7edcd;
  --bg:#f4f6f9;
  --surface:#ffffff;
  --surface-2:#f0f2f6;
  --border:#dde2ea;
  --text:#171b21;
  --text-muted:#5c6474;
  --success:#2f7a4d;
  --success-bg:#e6f4ea;
  --danger:#b3402a;
  --danger-bg:#fbe9e5;
  --warn:#a9761c;
  --warn-bg:#faf1de;
  --shadow: 0 1px 2px rgba(15,30,48,0.06), 0 4px 14px rgba(15,30,48,0.06);
  --radius: 10px;
  --font-head: 'Lexend', 'Segoe UI', Arial, sans-serif;
  --font-body: 'Inter', 'Segoe UI', Arial, sans-serif;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --bg:#0d1420;
    --surface:#141d2c;
    --surface-2:#182335;
    --border:#28374d;
    --text:#e9edf3;
    --text-muted:#93a0b5;
    --navy-100:#1c2a3f;
    --success-bg:#12301f;
    --danger-bg:#341a15;
    --warn-bg:#33280f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1420;
  --surface:#141d2c;
  --surface-2:#182335;
  --border:#28374d;
  --text:#e9edf3;
  --text-muted:#93a0b5;
  --navy-100:#1c2a3f;
  --success-bg:#12301f;
  --danger-bg:#341a15;
  --warn-bg:#33280f;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-head); margin:0; color:var(--text); font-weight:700;}
a{color:inherit;}
button{font-family:var(--font-body); cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
.app-shell{min-height:100vh;display:flex;flex-direction:column;}

/* Topbar */
.topbar{
  background:linear-gradient(135deg, var(--navy-900), var(--navy-800));
  color:#fff;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  position:sticky;
  top:0;
  z-index:40;
  box-shadow:var(--shadow);
}
.topbar .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.topbar .brand-mark{
  width:36px;height:36px;border-radius:9px;
  background:var(--gold-500);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-weight:800;color:var(--navy-950);
  font-size:15px; flex-shrink:0; overflow:hidden;
}
.topbar .brand-mark img{width:100%;height:100%;object-fit:cover;}
.topbar .brand-name{font-family:var(--font-head);font-weight:700;font-size:17px;letter-spacing:0.2px;}
.topbar .brand-sub{font-size:11.5px;color:#c9d4e3;}
.topbar .spacer{flex:1;}
.topbar .year-pill{
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.18);
  padding:6px 12px;border-radius:20px;font-size:12.5px;color:#e7edf5;
  white-space:nowrap;
}
.topbar .icon-btn{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.16);
  color:#fff;width:34px;height:34px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.topbar .icon-btn:hover{background:rgba(255,255,255,0.18);}
.back-btn{
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  color:#fff;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.back-btn:hover{background:rgba(255,255,255,0.2);}

.view-title{font-family:var(--font-head);font-weight:700;font-size:16px;color:#fff;}

/* Home grid */
.home-wrap{max-width:1180px;margin:0 auto;padding:34px 22px 60px;width:100%;}
.home-hero{margin-bottom:26px;}
.home-hero h1{font-size:26px;}
.home-hero p{color:var(--text-muted);margin-top:6px;font-size:14px;}
.stats-row{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;margin-bottom:28px;
}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);
}
.stat-card .stat-label{font-size:12px;color:var(--text-muted);font-weight:600;}
.stat-card .stat-value{font-family:var(--font-head);font-size:23px;font-weight:700;margin-top:4px;}
.stat-card.alert{border-color:#e3b3a5;background:var(--danger-bg);}
.stat-card.alert .stat-value{color:var(--danger);}

.module-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;
}
.module-tile{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px 16px;
  text-align:left;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;
  transition:transform .12s ease, border-color .12s ease;
  position:relative;
  overflow:hidden;
}
.module-tile:hover{transform:translateY(-2px);border-color:var(--gold-500);}
.module-tile:focus-visible{outline:2px solid var(--gold-500);outline-offset:2px;}
.module-tile .tile-icon{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  background:var(--navy-100);color:var(--navy-800);
}
.module-tile .tile-title{font-family:var(--font-head);font-weight:600;font-size:14.5px;}
.module-tile .tile-desc{font-size:12px;color:var(--text-muted);line-height:1.4;}
.module-tile .tile-badge{
  position:absolute;top:12px;right:12px;
  background:var(--danger);color:#fff;font-size:11px;font-weight:700;
  padding:2px 7px;border-radius:20px;
}

/* Content area for module views */
.view-wrap{max-width:1180px;margin:0 auto;padding:22px;width:100%;}
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.panel-header{
  padding:16px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.panel-header h2{font-size:16.5px;}
.panel-body{padding:16px 18px;}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

.btn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  padding:8px 13px;border-radius:8px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--navy-700);}
.btn-primary{background:var(--navy-800);border-color:var(--navy-800);color:#fff;}
.btn-primary:hover{background:var(--navy-700);}
.btn-gold{background:var(--gold-500);border-color:var(--gold-500);color:var(--navy-950);}
.btn-gold:hover{background:var(--gold-600);}
.btn-danger{background:var(--danger-bg);border-color:#e3b3a5;color:var(--danger);}
.btn-sm{padding:5px 9px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.input, select.input, textarea.input{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;border-radius:8px;font-size:13.5px;font-family:var(--font-body);
}
.input:focus, select.input:focus, textarea.input:focus{outline:2px solid var(--gold-500);outline-offset:0;border-color:var(--gold-500);}
label.field-label{font-size:12.5px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;}
.field{margin-bottom:12px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media (max-width:640px){.field-row,.field-row3{grid-template-columns:1fr;}}

table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
table.data-table th{
  text-align:left;padding:9px 10px;color:var(--text-muted);font-weight:600;
  border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px;
}
table.data-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.data-table tr:hover td{background:var(--surface-2);}
.table-scroll{overflow-x:auto;}
.pill{padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;display:inline-block;white-space:nowrap;}
.pill-success{background:var(--success-bg);color:var(--success);}
.pill-danger{background:var(--danger-bg);color:var(--danger);}
.pill-warn{background:var(--warn-bg);color:var(--warn);}
.pill-muted{background:var(--surface-2);color:var(--text-muted);}
.empty-state{padding:34px 20px;text-align:center;color:var(--text-muted);}
.empty-state .empty-icon{font-size:30px;margin-bottom:8px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap;}
.tab-btn{padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;background:none;border-left:none;border-right:none;border-top:none;}
.tab-btn.active{color:var(--navy-800);border-bottom-color:var(--gold-500);}
:root[data-theme="dark"] .tab-btn.active, :root:not([data-theme="light"]) .tab-btn.active{color:var(--gold-500);}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,16,26,0.55);
  display:flex;align-items:flex-start;justify-content:center;
  padding:5vh 16px; z-index:100; overflow-y:auto;
}
.modal-box{
  background:var(--surface);border-radius:14px;max-width:640px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.3); border:1px solid var(--border);
  margin-bottom:5vh;
}
.modal-box.modal-lg{max-width:920px;}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{font-size:16px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);line-height:1;}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

.pdf-frame{width:100%;height:72vh;border:1px solid var(--border);border-radius:8px;background:#525659;}

.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--navy-900);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,0.25); min-width:220px; animation:toast-in .18s ease;
}
.toast.success{background:var(--success);}
.toast.danger{background:var(--danger);}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.section-title{font-family:var(--font-head);font-weight:700;font-size:14px;margin:18px 0 10px;color:var(--navy-800);}
:root[data-theme="dark"] .section-title, :root:not([data-theme="light"]) .section-title{color:var(--gold-500);}
.muted{color:var(--text-muted);}
.right{text-align:right;}
.center{text-align:center;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:800px){.grid-2{grid-template-columns:1fr;}}
.avatar-circle{
  width:54px;height:54px;border-radius:50%;background:var(--navy-100);color:var(--navy-800);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:18px;
  flex-shrink:0;
}
.eleve-card-header{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);}
.link-btn{background:none;border:none;color:var(--navy-800);font-weight:600;font-size:13px;text-decoration:underline;padding:0;}
:root[data-theme="dark"] .link-btn, :root:not([data-theme="light"]) .link-btn{color:var(--gold-500);}
.kpi-mini{display:flex;flex-direction:column;gap:2px;}
.kpi-mini .v{font-family:var(--font-head);font-weight:700;font-size:18px;}
.kpi-mini .l{font-size:11.5px;color:var(--text-muted);}
.schedule-grid{display:grid;grid-template-columns:70px repeat(6,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:11.5px;}
.schedule-grid .cell{background:var(--surface);padding:4px;min-height:44px;}
.schedule-grid .head{background:var(--navy-100);font-weight:700;text-align:center;padding:7px 4px;}
.schedule-grid .timecol{background:var(--surface-2);text-align:center;font-weight:600;display:flex;align-items:center;justify-content:center;}
.schedule-slot{background:var(--navy-100);border-radius:5px;padding:4px 5px;font-size:10.5px;cursor:pointer;height:100%;}
.schedule-slot .m{font-weight:700;display:block;}
.empty-cell{cursor:pointer;height:100%;width:100%;display:block;border:none;background:transparent;}
.empty-cell:hover{background:var(--surface-2);}
@media print{.no-print{display:none;}}
</style>
</head>
<body>
<div id="app-root"></div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>
<script>
(function(){
"use strict";

/* =========================================================
   EDUGESTION — utilitaires généraux
   ========================================================= */
const STORAGE_KEY = "edugestion_data_v1";
const THEME_KEY = "edugestion_theme_v1";

function uid(prefix){ return (prefix||"id")+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

function todayISO(){ return new Date().toISOString().slice(0,10); }

function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateLong(d){
  if(!d) return "—";
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
}
function fmtMoney(n){
  n = Number(n)||0;
  const devise = state.parametres.etablissement.devise || "FCFA";
  return n.toLocaleString('fr-FR',{maximumFractionDigits:0}) + " " + devise;
}
function daysBetween(a,b){
  const A = new Date(a+"T00:00:00"), B = new Date(b+"T00:00:00");
  return Math.round((B-A)/86400000);
}
function esc(s){
  if(s===undefined || s===null) return "";
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function initials(nom,prenom){
  return ((prenom||"")[0]||"").toUpperCase() + ((nom||"")[0]||"").toUpperCase();
}

/* Conversion nombre -> lettres (français), pour les reçus */
function nombreEnLettres(n){
  n = Math.round(Number(n)||0);
  if(n===0) return "zéro";
  const unites = ["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix",
    "onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  const dizaines = ["","dix","vingt","trente","quarante","cinquante","soixante","soixante-dix","quatre-vingt","quatre-vingt-dix"];
  function troisChiffres(num){
    let c = Math.floor(num/100), r = num%100, out=[];
    if(c>0){ out.push(c===1?"cent":unites[c]+" cent"+(c>1&&r===0?"s":"")); }
    if(r>0){
      if(r<20) out.push(unites[r]);
      else{
        let d = Math.floor(r/10), u = r%10;
        if(d===7||d===9){ out.push(dizaines[d-1]+"-"+unites[10+u]); }
        else{
          let base = dizaines[d];
          if(u===1 && (d===1||d===2||d===3||d===4||d===5||d===6||d===8)) base += "-et-un";
          else if(u>0) base += "-"+unites[u];
          if(d===8 && u===0) base += "s";
          out.push(base);
        }
      }
    }
    return out.join(" ");
  }
  const tranches = [
    {v:1000000000, s:"milliard"},
    {v:1000000, s:"million"},
    {v:1000, s:"mille"},
    {v:1, s:""}
  ];
  let reste = n, parts=[];
  for(const t of tranches){
    if(reste >= t.v){
      let q = Math.floor(reste / t.v);
      reste = reste % t.v;
      if(t.v===1000 && q===1){ parts.push("mille"); }
      else{
        let mot = troisChiffres(q);
        if(t.s){ mot += " "+t.s + (q>1 && t.v!==1000 ? "s":""); }
        parts.push(mot);
      }
    }
  }
  return parts.join(" ").replace(/\s+/g," ").trim();
}

/* =========================================================
   ÉTAT / PERSISTANCE
   ========================================================= */
function defaultState(){
  return {
    parametres:{
      etablissement:{
        nom:"Mon Établissement Scolaire",
        sigle:"",
        adresse:"",
        telephone:"",
        email:"",
        devise:"FCFA",
        logo:"",
        anneeScolaire: (new Date().getMonth()>=8) ? (new Date().getFullYear())+"-"+(new Date().getFullYear()+1) : (new Date().getFullYear()-1)+"-"+(new Date().getFullYear())
      },
      trimestres:[
        {id:uid('tri'), nom:"1er Trimestre", dateDebut:"", dateFin:""},
        {id:uid('tri'), nom:"2e Trimestre", dateDebut:"", dateFin:""},
        {id:uid('tri'), nom:"3e Trimestre", dateDebut:"", dateFin:""}
      ],
      bareme:20,
      licence:{actif:false, cle:'', dateActivation:'', expiration:''},
      acces:{actif:false, pins:{chef:'', finances:'', infirmier:'', bibliothecaire:''}},
      seuilRetardJours:30,
      mentions:[
        {seuil:16,label:"Excellent"},
        {seuil:14,label:"Très Bien"},
        {seuil:12,label:"Bien"},
        {seuil:10,label:"Assez Bien"},
        {seuil:0,label:"Insuffisant"}
      ]
    },
    cycles:[
      {id:uid('cyc'), nom:"Préscolaire", ordre:1},
      {id:uid('cyc'), nom:"Primaire", ordre:2},
      {id:uid('cyc'), nom:"Secondaire", ordre:3}
    ],
    niveaux:[],
    classes:[],
    matieres:[],
    eleves:[],
    enseignants:[],
    personnel:[],
    inscriptions:[],
    paiements:[],
    evaluations:[],
    notes:[],
    emploiSlots:[],
    comptaEntries:[],
    cantineMenus:[],
    cantineInscriptions:[],
    transportCircuits:[],
    transportInscriptions:[],
    evenements:[],
    oeuvres:[],
    materiels:[],
    magasinArticles:[],
    magasinMouvements:[],
    tenueArticles:[],
    tenueDistributions:[],
    livres:[],
    emprunts:[],
    fichesMedicales:[],
    visitesInfirmerie:[]
  };
}

let state = loadState();

function hydrateState(parsed){
  const base = defaultState();
  // merge shallow to tolerate schema growth
  for(const k in base){ if(!(k in parsed)) parsed[k]=base[k]; }
  if(!parsed.parametres) parsed.parametres = base.parametres;
  for(const k in base.parametres){ if(!(k in parsed.parametres)) parsed.parametres[k]=base.parametres[k]; }
  if(!parsed.parametres.etablissement) parsed.parametres.etablissement = base.parametres.etablissement;
  if(!parsed.parametres.licence) parsed.parametres.licence = base.parametres.licence;
  if(!('expiration' in parsed.parametres.licence)) parsed.parametres.licence.expiration = '';
  if(!parsed.parametres.acces) parsed.parametres.acces = base.parametres.acces;
  if(!parsed.parametres.acces.pins){
    // migration depuis l'ancien format {pinChef, pinFinances}
    const old = parsed.parametres.acces;
    parsed.parametres.acces.pins = {chef: old.pinChef||'', finances: old.pinFinances||'', infirmier:'', bibliothecaire:''};
    delete parsed.parametres.acces.pinChef;
    delete parsed.parametres.acces.pinFinances;
  }
  if(!('infirmier' in parsed.parametres.acces.pins)) parsed.parametres.acces.pins.infirmier = '';

}

function upsert(key,obj){

/* =========================================================
   TÉLÉCHARGEMENTS (capacité "downloads" de la page publiée)
   ========================================================= */
let downloadsCap = null;
let downloadsCapReady = false;
(async function initDownloadsCapability(){
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      downloadsCap = await window.claude.use('downloads');
    }
  }catch(e){ downloadsCap = null; }
  downloadsCapReady = true;
})();
async function saveFile(filename, data){
  // attend un court instant si la capacité n'a pas fini de se résoudre
  for(let i=0;i<20 && !downloadsCapReady;i++){ await new Promise(r=>setTimeout(r,100)); }
  if(downloadsCap){
    try{
      await downloadsCap.save({filename, data});
      toast("Fichier téléchargé.","success");
      return true;
    }catch(err){
      const code = err && err.code;
      if(code==='declined'){ return false; }
      if(code==='unavailable' || code==='not_granted' || code==='capability_disabled' || code==='capability_removed'){
        toast("Le téléchargement n'est pas disponible dans cet environnement.","danger");
      }else if(code==='too_large'){
        toast("Fichier trop volumineux pour être téléchargé ici.","danger");
      }else{
        toast("Téléchargement impossible : "+(err&&err.message?err.message:'erreur inconnue'),"danger");
      }
      return false;
    }
  }else{
    // Repli : tentative de téléchargement navigateur classique (fonctionne hors page publiée)
    try{
      const blob = (data instanceof Blob) ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast("Fichier téléchargé.","success");
      return true;
    }catch(e){
      toast("Le téléchargement n'est pas disponible dans cet environnement.","danger");
      return false;
    }
  }
}
window.saveFile = saveFile;

/* =========================================================
   LICENCE (mode essai / mode licencié)
   ---------------------------------------------------------
   Vérification purement locale (pas de serveur — ce fichier est
   distribué et fonctionne hors ligne, donc aucune vérification
   serveur n'est possible). La clé est une signature cryptographique
   HMAC-SHA256 (API Web Crypto du navigateur) du nom de l'établissement
   et d'une date d'expiration éventuelle, avec un secret intégré au
   code. Contrairement à une simple formule arithmétique, cette
   signature ne peut pas être recalculée à la main ni déduite par
   simple lecture du code — il faudrait extraire le secret et
   reproduire l'algorithme volontairement. Ce n'est cependant jamais
   une protection absolue côté client : la génération des clés se
   fait exclusivement avec l'outil séparé (non distribué aux écoles)
   fourni au vendeur du logiciel.
   ========================================================= */
const TRIAL_MAX_ELEVES = 30;
const LICENCE_SECRET = "EDUGESTION-LIC-v2-7f2a9c4e1b6d8830-KM4-NE-PAS-DIFFUSER";
function normalizeForLicence(s){
  return String(s||'').trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
}
async function hmacSha256Hex(secret, message){
  const enc = new TextEncoder();
  const cryptoObj = (typeof crypto!=='undefined') ? crypto : window.crypto;
  const key = await cryptoObj.subtle.importKey('raw', enc.encode(secret), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const sig = await cryptoObj.subtle.sign('HMAC', key, enc.encode(message));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function computeLicenceSignature(nomEtablissement, expiryCompact){
  const payload = normalizeForLicence(nomEtablissement)+"|"+expiryCompact;
  const full = await hmacSha256Hex(LICENCE_SECRET, payload);
  return full.slice(0,20).toUpperCase();
}
function parseLicenceKey(key){
  const cleaned = String(key||'').trim().toUpperCase().replace(/\s+/g,'');
  const m = cleaned.match(/^EDUG2-(\d{8})-([0-9A-F]{4})-([0-9A-F]{4})-([0-9A-F]{4})-([0-9A-F]{4})-([0-9A-F]{4})$/);
  if(!m) return null;
  return {expiry:m[1], sig:m[2]+m[3]+m[4]+m[5]+m[6], clean:cleaned};
}
async function validateLicenceKeyDetailed(nomEtablissement, key){
  const parsed = parseLicenceKey(key);
  if(!parsed) return {valid:false, reason:'format'};
  const expected = await computeLicenceSignature(nomEtablissement, parsed.expiry);
  if(expected !== parsed.sig) return {valid:false, reason:'signature'};
  if(parsed.expiry !== '00000000'){
    const todayCompact = todayISO().replace(/-/g,'');
    if(parsed.expiry < todayCompact) return {valid:false, reason:'expired', expiry:parsed.expiry};
  }
  return {valid:true, expiry: parsed.expiry==='00000000' ? '' : parsed.expiry, clean:parsed.clean};
}
function expiryCompactToISO(c){
  if(!c) return '';
  return c.slice(0,4)+'-'+c.slice(4,6)+'-'+c.slice(6,8);
}
function isLicensed(){ return !!(state.parametres.licence && state.parametres.licence.actif); }
/* Re-vérifie la licence enregistrée à chaque chargement (signature + expiration).
   Une licence invalide ou expirée est automatiquement désactivée. */
async function revalidateLicenceOnLoad(){
  const lic = state.parametres.licence;
  if(!lic || !lic.actif || !lic.cle) return;
  const result = await validateLicenceKeyDetailed(state.parametres.etablissement.nom, lic.cle);
  if(!result.valid){
    lic.actif = false;
    persist();
    const msg = result.reason==='expired'
      ? "Votre licence a expiré le "+fmtDate(expiryCompactToISO(result.expiry))+" — retour en version d'essai."
      : "La licence enregistrée n'est plus valide (nom d'établissement modifié ou clé invalide) — retour en version d'essai.";
    toast(msg,"danger");
    renderApp();
  }
}
function activesEleveCount(){ return state.eleves.filter(e=>e.statut!=='inactif').length; }
function canAddEleve(nb){
  nb = nb||1;
  if(isLicensed()) return true;
  return (activesEleveCount()+nb) <= TRIAL_MAX_ELEVES;
}
function licenceBannerHtml(compact){
  if(isLicensed()) return '';
  const restant = Math.max(0, TRIAL_MAX_ELEVES-activesEleveCount());
  return `<div style="background:var(--warn-bg);border:1px solid #e3c98a;color:var(--warn);padding:${compact?'8px 14px':'10px 16px'};border-radius:8px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:${compact?'0':'16px'};">
    <span>🔓 <strong>Version d'essai</strong> — ${activesEleveCount()}/${TRIAL_MAX_ELEVES} élèves utilisés (${restant} restants) · documents générés avec filigrane</span>
    <button class="btn btn-sm btn-gold" onclick="navigate('parametres')">Activer une licence</button>
  </div>`;
}
function addTrialWatermark(doc){
  if(isLicensed()) return;
  const pages = doc.internal.getNumberOfPages();
  const w = doc.internal.pageSize.getWidth(), h = doc.internal.pageSize.getHeight();

    doc.text("VERSION D'ESSAI — NON LICENCIÉE", w/2, h/2, {align:'center', angle:35});
    doc.setTextColor(20,20,20);
  }
}

/* =========================================================
   ACCÈS RESTREINT (Comptabilité, Matériel/Magasin, Tenues, Infirmerie)
   ---------------------------------------------------------
   Réservé à certains rôles (Chef d'établissement, Chargé des
   finances et du matériel, Infirmier(ère)...) via un code PIN
   propre à chaque rôle. Vérification locale uniquement (pas de
   serveur) : dissuade un accès non autorisé au sein de
   l'établissement, mais n'est pas inviolable par quelqu'un qui
   lirait le code source de la page.
   ========================================================= */
const ACCESS_ROLES = [
  {id:'chef', label:"Chef d'établissement"},
  {id:'finances', label:"Chargé des finances et du matériel"},
  {id:'infirmier', label:"Infirmier(ère)"},
  {id:'bibliothecaire', label:"Bibliothécaire"}
];
const ACCESS_SESSION_KEY = "edugestion_access_role_v1";
let accessUnlockedRole = null;
(function initAccessSession(){
  try{ accessUnlockedRole = sessionStorage.getItem(ACCESS_SESSION_KEY) || null; }catch(e){ accessUnlockedRole = null; }
})();
function accesConfig(){
  const ac = state.parametres.acces || {actif:false, pins:{}};
  if(!ac.pins) ac.pins = {};
  return ac;
}
function roleLabel(role){
  const r = ACCESS_ROLES.find(x=>x.id===role);
  return r ? r.label : '—';
}
function moduleAllowedRoles(mod){ return mod.allowedRoles || []; }
function moduleRestrictionActive(mod){
  const ac = accesConfig();
  if(!ac.actif) return false;
  return moduleAllowedRoles(mod).some(r=>ac.pins[r]);
}
function hasRestrictedAccess(mod){
  if(!moduleRestrictionActive(mod)) return true;
  return !!(accessUnlockedRole && moduleAllowedRoles(mod).includes(accessUnlockedRole));
}
function tryUnlockAccess(role, pin){
  const ac = accesConfig();
  const expected = ac.pins[role];
  if(!expected || String(pin).trim()!==String(expected).trim()) return false;
  accessUnlockedRole = role;
  try{ sessionStorage.setItem(ACCESS_SESSION_KEY, role); }catch(e){}
  return true;
}
function clearAccessUnlock(){
  accessUnlockedRole = null;
  try{ sessionStorage.removeItem(ACCESS_SESSION_KEY); }catch(e){}
}
window.lockRestrictedAccess = function(){
  clearAccessUnlock();
  toast("Accès verrouillé.","success");
  navigate('');
};
function submitAccessPin(){
  const roleSel = document.getElementById('access-role-select');
  const pinInput = document.getElementById('access-pin-input');
  const role = roleSel ? roleSel.value : '';
  const pin = pinInput ? pinInput.value : '';
  if(!role){ toast("Sélectionnez votre rôle.","danger"); return; }
  if(!pin){ toast("Saisissez le code d'accès.","danger"); return; }
  if(tryUnlockAccess(role, pin)){
    toast("Accès autorisé — bienvenue.","success");
    renderApp();
  }else{
    toast("Code d'accès incorrect.","danger");
    if(pinInput){ pinInput.value=''; pinInput.focus(); }
  }
}
window.submitAccessPin = submitAccessPin;

  const ac = accesConfig();
  const allowed = moduleAllowedRoles(mod);

  return `

      <div class="panel-body">
        <p class="muted" style="margin-top:0;">Le module « ${esc(mod.title)} » est réservé à : ${rolesForMod.map(r=>`<strong>${esc(r.label)}</strong>`).join(', ')}. Veuillez vous identifier.</p>
        <div class="field">
          <label class="field-label">Votre rôle</label>
          <select class="input" id="access-role-select">
            ${rolesForMod.map(r=>`<option value="${r.id}" ${ac.pins[r.id]?'':'disabled'}>${esc(r.label)}${ac.pins[r.id]?'':' (non configuré)'}</option>`).join('')}

        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="submitAccessPin()">Déverrouiller</button>
        ${!anyConfigured ? `<p class="muted" style="font-size:12px;margin-top:12px;">Aucun code n'a encore été configuré. Le Chef d'établissement peut en définir un depuis <button class="link-btn" onclick="closeModal();navigate('parametres')">Paramètres académiques</button>.</p>` : ''}

/* =========================================================
   MOTEUR DE FORMULAIRE GÉNÉRIQUE (pour CRUD simples)
   fields: [{key,label,type,required,options:[{value,label}] | fn(), placeholder, step}]
   ========================================================= */
function renderFieldInput(f, val){
  val = (val===undefined || val===null) ? "" : val;
  const req = f.required ? "required" : "";
  const id = "f_"+f.key;
  if(f.type==='select'){
    const opts = typeof f.options==='function' ? f.options() : (f.options||[]);
    return `<select class="input" id="${id}" ${req}>
      <option value="">-- Sélectionner --</option>
      ${opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(val)?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select>`;
  }
  if(f.type==='textarea'){
    return `<textarea class="input" id="${id}" rows="3" ${req} placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>`;
  }
  if(f.type==='checkbox-list'){
    const opts = typeof f.options==='function' ? f.options() : (f.options||[]);
    const selected = Array.isArray(val) ? val : [];
    return `<div style="display:flex;flex-wrap:wrap;gap:10px;">${opts.map(o=>`
      <label style="display:flex;align-items:center;gap:5px;font-size:12.5px;background:var(--surface-2);padding:5px 9px;border-radius:7px;">
        <input type="checkbox" value="${esc(o.value)}" data-cbgroup="${id}" ${selected.includes(o.value)?'checked':''}/> ${esc(o.label)}
      </label>`).join('')}</div>`;
  }
  return `<input class="input" id="${id}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} value="${esc(val)}" ${req} placeholder="${esc(f.placeholder||'')}"/>`;
}
function renderForm(fields, data){
  data = data||{};
  return fields.map(f=>{
    if(f.type==='hr') return `<div class="section-title">${esc(f.label||'')}</div>`;
    return `<div class="field"><label class="field-label">${esc(f.label)}${f.required?' *':''}</label>${renderFieldInput(f, data[f.key])}</div>`;
  }).join('');
}
function collectForm(fields){
  const out = {};
  for(const f of fields){
    if(f.type==='hr') continue;
    if(f.type==='checkbox-list'){
      const boxes = document.querySelectorAll(`[data-cbgroup="f_${f.key}"]`);
      out[f.key] = Array.from(boxes).filter(b=>b.checked).map(b=>b.value);
      continue;
    }
    const el = document.getElementById('f_'+f.key);
    if(!el) continue;
    out[f.key] = f.type==='number' ? (el.value===''?0:Number(el.value)) : el.value;
  }
  return out;
}
function validateForm(fields){
  for(const f of fields){
    if(f.required && f.type!=='hr'){
      const el = document.getElementById('f_'+f.key);
      if(el && !el.value){ toast("Le champ « "+f.label+" » est requis.","danger"); el.focus(); return false; }
    }
  }
  return true;
}

/* Générateur de module CRUD générique (listes simples : cycles, matières, etc.) */
function crudModule(cfg){
  // cfg: {key, titleSingular, titlePlural, icon, fields, columns:[{key,label,render}], extraToolbar, sortFn}
  function openForm(existing){
    const data = existing || {};
    const fieldsHtml = renderForm(cfg.fields, data);
    openModal({
      title:(existing?"Modifier — ":"Ajouter — ")+cfg.titleSingular,
      bodyHtml:`<div>${fieldsHtml}</div>`,
      footerHtml:`<button class="btn" onclick="closeModal()">Annuler</button>
                  <button class="btn btn-primary" id="save-crud-btn">Enregistrer</button>`
    });
    document.getElementById('save-crud-btn').onclick = function(){
      if(!validateForm(cfg.fields)) return;
      const values = collectForm(cfg.fields);
      const obj = Object.assign({}, data, values, {id: data.id || uid(cfg.key.slice(0,3))});
      if(cfg.beforeSave) cfg.beforeSave(obj);
      upsert(cfg.key, obj);
      closeModal();
      toast((existing?"Modifié":"Ajouté")+" avec succès.","success");
      renderApp();
    };
  }
  window['open_'+cfg.key+'_form'] = openForm;
  window['delete_'+cfg.key+'_item'] = function(id){
    confirmAction("Supprimer cet élément définitivement ?", function(){
      removeById(cfg.key, id);
      toast("Supprimé.","success");
      renderApp();
    });
  };
  let list = getList(cfg.key).slice();
  if(cfg.sortFn) list.sort(cfg.sortFn);
  const rows = list.map(item=>`
    <tr>
      ${cfg.columns.map(c=>`<td>${c.render ? c.render(item) : esc(item[c.key])}</td>`).join('')}
      <td class="right">
        <button class="btn btn-sm" onclick="open_${cfg.key}_form('${item.id}')">Modifier</button>
        <button class="btn btn-sm btn-danger" onclick="delete_${cfg.key}_item('${item.id}')">Supprimer</button>
      </td>
    </tr>`).join('');
  // patch open_form to accept id lookup when called from HTML string
  window['open_'+cfg.key+'_form'] = function(id){ openForm(id?findById(cfg.key,id):null); };

  return `
    <div class="panel">
      <div class="panel-header">
        <h2>${esc(cfg.titlePlural)}</h2>
        <div class="toolbar">
          ${cfg.extraToolbar||''}
          <button class="btn btn-primary" onclick="open_${cfg.key}_form()">+ Ajouter</button>
        </div>
      </div>
      <div class="panel-body">
        ${list.length===0 ? emptyState(cfg.icon||'📋', "Aucun élément pour l'instant.") : `
        <div class="table-scroll"><table class="data-table">
          <thead><tr>${cfg.columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}<th class="right">Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`}
      </div>
    </div>`;
}
function emptyState(icon, text){
  return `<div class="empty-state"><div class="empty-icon">${icon}</div><div>${esc(text)}</div></div>`;
}

function renderApp(){
  const parts = parseHash();
  const root = document.getElementById('app-root');
  if(parts.length===0){
    root.innerHTML = renderHome();
    return;
  }
  const modId = parts[0];
  const mod = MODULES.find(m=>m.id===modId);
  if(!mod){ root.innerHTML = renderHome(); return; }
  if(mod.restricted && !hasRestrictedAccess(mod)){
    root.innerHTML = `${renderTopbar(mod)}${renderAccessGate(mod)}`;
    return;
  }
  let content = "";
  try{
    content = RENDERERS[modId] ? RENDERERS[modId](parts.slice(1)) : emptyState('🚧',"Module en construction.");
  }catch(e){
    console.error(e);
    content = emptyState('⚠️', "Une erreur est survenue lors de l'affichage de ce module.");
  }
  root.innerHTML = `
    ${renderTopbar(mod)}
    <div class="view-wrap">${content}</div>
  `;
}

/* =========================================================
   CALCULS FINANCIERS (inscriptions / paiements / comptabilité)
   ========================================================= */
function paiementsOf(inscriptionId){ return state.paiements.filter(p=>p.inscriptionId===inscriptionId); }
function totalPaye(inscriptionId){ return paiementsOf(inscriptionId).reduce((s,p)=>s+Number(p.montant||0),0); }
function soldeInscription(insc){ return Math.max(0, Number(insc.fraisScolariteTotal||0) - totalPaye(insc.id)); }

function getRetards(){
  const seuil = Number(state.parametres.seuilRetardJours||30);
  const out = [];
  for(const insc of state.inscriptions){
    const solde = soldeInscription(insc);
    if(solde<=0) continue;
    const echeance = insc.dateEcheance || addDaysISO(insc.dateInscription, seuil);
    const retardJours = daysBetween(echeance, todayISO());
    if(retardJours>0){
      const eleve = findById('eleves', insc.eleveId);
      out.push({insc, eleve, solde, retardJours, echeance});
    }
  }
  return out.sort((a,b)=>b.retardJours-a.retardJours);
}
function addDaysISO(iso, days){
  if(!iso) iso = todayISO();
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+Number(days||0));
  return d.toISOString().slice(0,10);
}
function totalRecettesMois(moisYYYYMM){
  let total = 0;
  total += state.paiements.filter(p=>p.date && p.date.slice(0,7)===moisYYYYMM).reduce((s,p)=>s+Number(p.montant||0),0);
  total += state.comptaEntries.filter(c=>c.type==='recette' && c.date && c.date.slice(0,7)===moisYYYYMM).reduce((s,c)=>s+Number(c.montant||0),0);
  total += state.cantineInscriptions.filter(c=>c.statutPaiement==='payé' && c.mois===moisYYYYMM).reduce((s,c)=>s+Number(c.montant||0),0);
  total += state.transportInscriptions.filter(c=>c.statutPaiement==='payé' && c.mois===moisYYYYMM).reduce((s,c)=>s+Number(c.montant||0),0);
  total += state.oeuvres.filter(o=>o.statutPaiement==='payé' && o.datePaiement && o.datePaiement.slice(0,7)===moisYYYYMM).reduce((s,o)=>s+Number(o.montant||0),0);
  total += state.tenueDistributions.filter(t=>t.statutPaiement==='payé' && t.date && t.date.slice(0,7)===moisYYYYMM).reduce((s,t)=>s+Number(t.montant||0),0);
  return total;
}
function totalDepensesMois(moisYYYYMM){
  return state.comptaEntries.filter(c=>c.type==='depense' && c.date && c.date.slice(0,7)===moisYYYYMM).reduce((s,c)=>s+Number(c.montant||0),0);
}
function nextRecuNumero(){
  const n = state.paiements.length + 1;
  const annee = state.parametres.etablissement.anneeScolaire.split('-')[0];
  return "REC-"+annee+"-"+String(n).padStart(5,'0');
}

/* =========================================================
   CALCULS PÉDAGOGIQUES (moyennes, coefficients)
   ========================================================= */
function classesOfNiveau(niveauId){ return state.classes.filter(c=>c.niveauId===niveauId); }
function elevesOfClasse(classeId){ return state.eleves.filter(e=>e.classeId===classeId && e.statut!=='inactif'); }
function matieresOfNiveau(niveauId){ return state.matieres.filter(m=>(m.niveaux||[]).includes(niveauId)); }
function matieresOfClasse(classeId){
  const cl = findById('classes', classeId);
  if(!cl) return [];
  return matieresOfNiveau(cl.niveauId);
}
function evaluationsFor(classeId, matiereId, trimestre){
  return state.evaluations.filter(e=>e.classeId===classeId && e.matiereId===matiereId && e.trimestre===trimestre);
}
function noteFor(evaluationId, eleveId){
  return state.notes.find(n=>n.evaluationId===evaluationId && n.eleveId===eleveId);
}
// Moyenne d'un élève dans une matière pour un trimestre donné (pondérée /20)
function moyenneMatiereEleve(classeId, matiereId, trimestre, eleveId){
  const evals = evaluationsFor(classeId, matiereId, trimestre);
  let sommePonderee = 0, sommePoids = 0;
  for(const ev of evals){
    const n = noteFor(ev.id, eleveId);
    if(!n || n.note===undefined || n.note===null || n.note==='') continue;
    const noteSur20 = (Number(n.note)/Number(ev.noteSur||20))*20;
    const poids = Number(ev.ponderation||1);
    sommePonderee += noteSur20*poids;
    sommePoids += poids;
  }
  if(sommePoids===0) return null;
  return Math.round((sommePonderee/sommePoids)*100)/100;
}
// Moyenne générale pondérée par coefficients pour un élève / classe / trimestre
function moyenneGeneraleEleve(classeId, trimestre, eleveId){
  const matieres = matieresOfClasse(classeId);
  let sommeCoefMoy=0, sommeCoef=0, detail=[];
  for(const mat of matieres){
    const moy = moyenneMatiereEleve(classeId, mat.id, trimestre, eleveId);
    const coef = Number(mat.coefficient||1);
    detail.push({matiere:mat, moyenne:moy, coefficient:coef});
    if(moy!==null){ sommeCoefMoy += moy*coef; sommeCoef += coef; }
  }
  const moyGen = sommeCoef>0 ? Math.round((sommeCoefMoy/sommeCoef)*100)/100 : null;
  return {moyenneGenerale:moyGen, detail};
}
function classementClasse(classeId, trimestre){
  const eleves = elevesOfClasse(classeId);
  const rows = eleves.map(e=>{
    const r = moyenneGeneraleEleve(classeId, trimestre, e.id);
    return {eleve:e, moyenneGenerale:r.moyenneGenerale, detail:r.detail};
  });
  rows.sort((a,b)=>{
    if(a.moyenneGenerale===null) return 1;
    if(b.moyenneGenerale===null) return -1;
    return b.moyenneGenerale - a.moyenneGenerale;
  });
  rows.forEach((r,i)=>{ r.rang = (r.moyenneGenerale===null) ? '—' : (i+1); });
  return rows;
}
function mentionFor(moy){
  if(moy===null || moy===undefined) return "—";
  const mentions = state.parametres.mentions.slice().sort((a,b)=>b.seuil-a.seuil);
  for(const m of mentions){ if(moy>=m.seuil) return m.label; }
  return "—";
}

function normalizeHeader(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[_-]/g,' ').trim();
}
const ELEVE_IMPORT_MAP = {
  matricule:['matricule'],
  nom:['nom'],
  prenom:['prenom'],
  sexe:['sexe','genre'],
  dateNaissance:['date de naissance','naissance','ddn'],
  lieuNaissance:['lieu de naissance','lieu naissance'],
  classe:['classe']
};
function normalizeDateValue(v){
  if(!v) return '';
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m){ return m[3]+"-"+m[2].padStart(2,'0')+"-"+m[1].padStart(2,'0'); }
  return '';
}
function mapRowToEleve(row){
  const entries = Object.entries(row).map(([k,v])=>[normalizeHeader(k), v]);
  function findVal(keys){ for(const [nk,v] of entries){ if(keys.includes(nk)) return v; } return ''; }
  return {
    matricule: String(findVal(ELEVE_IMPORT_MAP.matricule)||'').trim(),
    nom: String(findVal(ELEVE_IMPORT_MAP.nom)||'').trim(),
    prenom: String(findVal(ELEVE_IMPORT_MAP.prenom)||'').trim(),
    sexe: String(findVal(ELEVE_IMPORT_MAP.sexe)||'').trim().toUpperCase().slice(0,1),
    dateNaissance: normalizeDateValue(findVal(ELEVE_IMPORT_MAP.dateNaissance)),
    lieuNaissance: String(findVal(ELEVE_IMPORT_MAP.lieuNaissance)||'').trim(),
    classeNom: String(findVal(ELEVE_IMPORT_MAP.classe)||'').trim()
  };
}
function downloadEleveTemplate(){
  if(typeof XLSX==='undefined'){ toast("Le module Excel n'a pas pu se charger.","danger"); return; }
  const wsData = [
    ["Matricule","Nom","Prénom","Sexe","Date de naissance","Lieu de naissance","Classe"],
    ["", "Kouassi", "Awa", "F", "2016-04-12", "—", state.classes[0]?state.classes[0].nom:"CP1"]
  ];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Élèves");
  const out = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  saveFile("Modele_Import_Eleves.xlsx", new Blob([out], {type:'application/octet-stream'}));
}
window.downloadEleveTemplate = downloadEleveTemplate;

function handleEleveImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(typeof XLSX==='undefined'){ toast("Le module Excel n'a pas pu se charger.","danger"); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:'', raw:false, dateNF:'yyyy-mm-dd'});
      if(rows.length===0){ toast("Le fichier ne contient aucune ligne de données.","danger"); return; }
      showEleveImportPreview(rows.map(mapRowToEleve));
    }catch(err){
      console.error(err);
      toast("Impossible de lire ce fichier. Vérifiez le format (.xlsx, .xls ou .csv).","danger");
    }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}
window.handleEleveImportFile = handleEleveImportFile;

  const rowsHtml = mapped.map((r,i)=>{
    const matchedClasseId = matchClasse(r.classeNom);
    const valid = r.nom && r.prenom;
    return `<tr data-row="${i}">

      <td><select class="input imp-classe" style="min-width:150px;">
            <option value="">-- Choisir --</option>
            ${state.classes.map(c=>`<option value="${c.id}" ${c.id===matchedClasseId?'selected':''}>${esc(c.nom)}</option>`).join('')}
          </select>
          ${(!matchedClasseId && r.classeNom) ? `<div style="font-size:10.5px;color:var(--danger);">« ${esc(r.classeNom)} » introuvable</div>`:''}
      </td>

  }).join('');

        <tbody>${rowsHtml}</tbody>
      </table></div>`,
    footerHtml:`<button class="btn" onclick="closeModal()">Annuler</button>
                <button class="btn btn-primary" id="confirm-import-btn">Importer les élèves sélectionnés</button>`
  });
  document.getElementById('confirm-import-btn').onclick = confirmEleveImport;
}
function confirmEleveImport(){
  const rowsEls = document.querySelectorAll('#modal-root tr[data-row]');
  let count=0, skipped=0, blockedByLicence=0;
  rowsEls.forEach(tr=>{
    if(!tr.querySelector('.imp-include').checked) return;
    const nom = tr.querySelector('.imp-nom').value.trim();
    const prenom = tr.querySelector('.imp-prenom').value.trim();
    const matricule = tr.querySelector('.imp-matricule').value.trim();
    const sexe = tr.querySelector('.imp-sexe').value;
    const dateNaissance = tr.querySelector('.imp-naissance').value;
    const classeId = tr.querySelector('.imp-classe').value;
    if(!nom || !prenom || !classeId){ skipped++; return; }
    if(!canAddEleve(1)){ blockedByLicence++; return; }
    state.eleves.push({
      id: uid('ele'), nom, prenom, sexe, dateNaissance, classeId,
      matricule: matricule || ("EL-"+state.parametres.etablissement.anneeScolaire.split('-')[0]+"-"+String(state.eleves.length+1).padStart(4,'0')),
      dateInscription: todayISO(), statut:'actif', responsables:[]
    });
    count++;
  });
  persist();
  closeModal();
  let msg = count+" élève(s) importé(s)";
  if(skipped) msg += ", "+skipped+" ignoré(s) (classe manquante)";
  if(blockedByLicence) msg += ", "+blockedByLicence+" bloqué(s) par la limite de la version d'essai ("+TRIAL_MAX_ELEVES+" élèves)";
  toast(msg+".", blockedByLicence?"danger":"success");
  renderApp();
}

const JOURS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const HEURES = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];

const SLOT_FIELDS = [
  {key:'matiereId', label:'Matière', type:'select', required:true, options:()=>[]}, // options set dynamically
  {key:'enseignantId', label:'Enseignant', type:'select', options:()=>state.enseignants.map(e=>({value:e.id,label:e.prenom+" "+e.nom}))},
  {key:'heureFin', label:'Heure de fin', type:'select', options:()=>HEURES.slice(1).concat(['17:00']).map(h=>({value:h,label:h}))},
  {key:'salle', label:'Salle'}
];
function openSlotForm(classeId, jour, heureDebut, existingId){
  const existing = existingId ? findById('emploiSlots', existingId) : null;
  const matieres = matieresOfClasse(classeId);
  const fields = SLOT_FIELDS.map(f=> f.key==='matiereId' ? Object.assign({}, f, {options:()=>matieres.map(m=>({value:m.id,label:m.nom}))}) : f);
  const data = existing || {heureFin: HEURES[HEURES.indexOf(heureDebut)+1] || '17:00'};
  openModal({
    title: (existing?"Modifier le":"Ajouter un")+" cours — "+jour+" "+heureDebut,
    bodyHtml:`<div>${renderForm(fields, data)}</div>`,
    footerHtml:`${existing?`<button class="btn btn-danger" id="del-slot-btn">Supprimer</button>`:''}
                <button class="btn" onclick="closeModal()">Annuler</button>
                <button class="btn btn-primary" id="save-slot-btn">Enregistrer</button>`
  });
  if(existing){
    document.getElementById('del-slot-btn').onclick=function(){
      confirmAction("Supprimer ce cours de l'emploi du temps ?", function(){
        removeById('emploiSlots', existing.id); closeModal(); toast("Supprimé.","success"); renderApp();
      });
    };
  }
  document.getElementById('save-slot-btn').onclick=function(){
    if(!validateForm(fields)) return;
    const values = collectForm(fields);
    const obj = Object.assign({}, data, values, {id:data.id||uid('slot'), classeId, jour, heureDebut});
    upsert('emploiSlots', obj);
    closeModal(); toast("Cours enregistré.","success"); renderApp();
  };
}
window.openSlotForm = openSlotForm;

window.deleteEval = function(evalId){

    state.notes = state.notes.filter(n=>n.evaluationId!==evalId);
    state.evaluations = state.evaluations.filter(e=>e.id!==evalId);

  });

function saveNoteInput(evaluationId, eleveId, val){
  const ev = findById('evaluations', evaluationId);
  let v = val==='' ? null : Math.max(0, Math.min(Number(ev.noteSur||20), Number(val)));
  let n = state.notes.find(x=>x.evaluationId===evaluationId && x.eleveId===eleveId);
  if(!n){ n = {id:uid('note'), evaluationId, eleveId, note:v}; state.notes.push(n); }
  else{ n.note = v; }
  persist();
}

const COMPTA_FIELDS = [
  {key:'type', label:'Type', type:'select', required:true, options:[{value:'recette',label:'Recette'},{value:'depense',label:'Dépense'}]},
  {key:'categorie', label:'Catégorie (ex : Fournitures, Salaires, Entretien, Dons)', required:true},
  {key:'montant', label:'Montant', type:'number', required:true},
  {key:'date', label:'Date', type:'date', required:true},
  {key:'mode', label:'Mode de règlement'},
  {key:'description', label:'Description', type:'textarea'}
];
function comptaPeriodOptions(){
  const set = new Set();
  state.paiements.forEach(p=>{ if(p.date) set.add(p.date.slice(0,7)); });
  state.comptaEntries.forEach(c=>{ if(c.date) set.add(c.date.slice(0,7)); });
  return Array.from(set).sort().reverse();
}
function gatherComptaData(periode){
  const inPeriode = (d)=> !periode || (d && d.slice(0,7)===periode);
  const paiements = state.paiements.filter(p=>inPeriode(p.date)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const entries = state.comptaEntries.filter(c=>inPeriode(c.date)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const recettesDiv = entries.filter(c=>c.type==='recette');
  const depenses = entries.filter(c=>c.type==='depense');
  const totalRecScol = paiements.reduce((s,p)=>s+Number(p.montant||0),0);
  const totalRecDiv = recettesDiv.reduce((s,c)=>s+Number(c.montant||0),0);
  const totalDep = depenses.reduce((s,c)=>s+Number(c.montant||0),0);
  return {paiements, entries, recettesDiv, depenses, totalRecScol, totalRecDiv, totalDep};
}
function exportComptaExcel(){
  if(typeof XLSX==='undefined'){ toast("Le module Excel n'a pas pu se charger.","danger"); return; }
  const periode = ui.filters.comptaPeriode || '';
  const d = gatherComptaData(periode);
  const wb = XLSX.utils.book_new();

  const wsResume = XLSX.utils.aoa_to_sheet([
    ["Rapport comptable — "+(state.parametres.etablissement.nom||'')],
    ["Période", periode||"Toutes les périodes"],
    [],
    ["Recettes scolarité", d.totalRecScol],
    ["Autres recettes", d.totalRecDiv],
    ["Dépenses", d.totalDep],
    ["Solde net", d.totalRecScol+d.totalRecDiv-d.totalDep]
  ]);
  XLSX.utils.book_append_sheet(wb, wsResume, "Résumé");

  const wsRecScol = XLSX.utils.json_to_sheet(d.paiements.map(p=>({
    "N° Reçu":p.numeroRecu, "Date":p.date, "Élève":eleveNomComplet(p.eleveId),
    "Classe":(function(){ const i=findById('inscriptions',p.inscriptionId); return i?classeLabel(i.classeId):''; })(),
    "Montant":Number(p.montant||0), "Mode":p.mode
  })));
  XLSX.utils.book_append_sheet(wb, wsRecScol, "Recettes scolarité");

  const wsAutres = XLSX.utils.json_to_sheet(d.entries.map(c=>({
    "Type":c.type==='recette'?'Recette':'Dépense', "Catégorie":c.categorie, "Montant":Number(c.montant||0),
    "Date":c.date, "Mode":c.mode||'', "Description":c.description||''
  })));
  XLSX.utils.book_append_sheet(wb, wsAutres, "Journal (autres)");

  const out = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  saveFile("Rapport_comptable_"+(periode||"toutes_periodes")+".xlsx", new Blob([out],{type:'application/octet-stream'}));
}
window.exportComptaExcel = exportComptaExcel;

function exportComptaPDF(){
  const periode = ui.filters.comptaPeriode || '';
  const d = gatherComptaData(periode);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  let y = pdfHeader(doc, "RAPPORT COMPTABLE — "+(periode?periode:"Toutes les périodes"));

  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.autoTable({
    startY:y,
    head:[["Poste","Montant"]],
    body:[
      ["Recettes scolarité", fmtMoney(d.totalRecScol)],
      ["Autres recettes", fmtMoney(d.totalRecDiv)],
      ["Dépenses", fmtMoney(d.totalDep)],
      ["Solde net", fmtMoney(d.totalRecScol+d.totalRecDiv-d.totalDep)]
    ],
    theme:'grid', headStyles:{fillColor:[30,58,95], textColor:255, fontStyle:'bold'}, margin:{left:15,right:15}
  });
  y = doc.lastAutoTable.finalY + 10;

  if(d.paiements.length>0){
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text("Recettes de scolarité", 15, y); y+=4;
    doc.autoTable({
      startY:y, head:[["Date","Élève","Montant","Mode"]],
      body:d.paiements.map(p=>[fmtDate(p.date), eleveNomComplet(p.eleveId), fmtMoney(p.montant), p.mode||'']),
      theme:'striped', headStyles:{fillColor:[201,162,39], textColor:20, fontStyle:'bold'}, styles:{fontSize:8.5}, margin:{left:15,right:15}
    });
    y = doc.lastAutoTable.finalY + 10;
  }
  if(d.entries.length>0){

/* ---- Rapport d'inventaire périodique ---- */
function inventairePeriodeRange(){
  const f = ui.filters.inventaire = ui.filters.inventaire || {type:'mois', mois: todayISO().slice(0,7), annee: String(new Date().getFullYear()), semestre:'S1', trimestreId:(state.parametres.trimestres[0]?.id||'')};
  const type = f.type;
  if(type==='mois'){
    const m = f.mois || todayISO().slice(0,7);
    const [y,mo] = m.split('-').map(Number);
    const debut = m+"-01";
    const finDate = new Date(y, mo, 0);
    const fin = finDate.toISOString().slice(0,10);
    return {label:"Mois de "+fmtDate(debut).slice(3), debut, fin};
  }
  if(type==='trimestre'){
    const tri = state.parametres.trimestres.find(t=>t.id===f.trimestreId);
    if(tri && tri.dateDebut && tri.dateFin){
      return {label:tri.nom, debut:tri.dateDebut, fin:tri.dateFin};
    }
    return {label:tri?tri.nom:"Trimestre", debut:null, fin:null};
  }
  if(type==='semestre'){
    const y = Number(f.annee)||new Date().getFullYear();
    if(f.semestre==='S2'){ return {label:"2e semestre "+y, debut:y+"-07-01", fin:y+"-12-31"}; }
    return {label:"1er semestre "+y, debut:y+"-01-01", fin:y+"-06-30"};
  }
  // année
  const y = Number(f.annee)||new Date().getFullYear();
  return {label:"Année "+y, debut:y+"-01-01", fin:y+"-12-31"};
}
function gatherInventaireData(range){
  const inRange = (d)=> !d ? false : (!range.debut || !range.fin ? true : (d>=range.debut && d<=range.fin));
  const mouvements = state.magasinMouvements.filter(m=>inRange(m.date)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const entrees = mouvements.filter(m=>m.type==='entree');
  const sorties = mouvements.filter(m=>m.type==='sortie');
  const parEtat = {Bon:0, Passable:0, Mauvais:0};
  state.materiels.forEach(m=>{ if(parEtat[m.etat]!==undefined) parEtat[m.etat]++; });
  return {materiels: state.materiels.slice(), entrees, sorties, parEtat};
}
function exportInventaireExcel(){
  if(typeof XLSX==='undefined'){ toast("Le module Excel n'a pas pu se charger.","danger"); return; }
  const range = inventairePeriodeRange();
  const d = gatherInventaireData(range);
  const wb = XLSX.utils.book_new();
  const wsResume = XLSX.utils.aoa_to_sheet([
    ["Rapport d'inventaire — "+(state.parametres.etablissement.nom||'')],
    ["Période", range.label],
    [],
    ["Matériel en bon état", d.parEtat.Bon],
    ["Matériel en état passable", d.parEtat.Passable],
    ["Matériel en mauvais état", d.parEtat.Mauvais],
    ["Total fiches matériel", d.materiels.length],
    ["Entrées magasin (période)", d.entrees.length],
    ["Sorties magasin (période)", d.sorties.length]
  ]);
  XLSX.utils.book_append_sheet(wb, wsResume, "Résumé");
  const wsMat = XLSX.utils.json_to_sheet(d.materiels.map(m=>({
    "Bureau":m.bureau, "Désignation":m.designation, "N° inventaire":m.numeroInventaire||'',
    "Quantité":Number(m.quantite||1), "Détenteur":(m.detenteurPrenom||'')+" "+(m.detenteurNom||''),
    "Fonction":m.fonction||'', "Source de financement":m.sourceFinancement||'', "État":m.etat||''
  })));
  XLSX.utils.book_append_sheet(wb, wsMat, "Matériel");
  const wsMvt = XLSX.utils.json_to_sheet([...d.entrees,...d.sorties].map(m=>({
    "N° Bon":m.numeroBon, "Type":m.type==='entree'?'Entrée':'Sortie', "Date":m.date,
    "Article":(findById('magasinArticles', m.articleId)||{}).designation||'', "Quantité":Number(m.quantite||0),
    "Provenance/Destination": m.type==='entree'?(m.provenance||''):(m.destination||'')
  })));
  XLSX.utils.book_append_sheet(wb, wsMvt, "Mouvements période");
  const out = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  saveFile("Inventaire_"+range.label.replace(/\s+/g,'_')+".xlsx", new Blob([out],{type:'application/octet-stream'}));
}

function handleRestoreFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      toast("Fichier invalide : ce n'est pas un JSON valide.","danger");
      input.value=''; return;
    }
    const looksValid = parsed && typeof parsed==='object' && ('eleves' in parsed) && ('classes' in parsed) && ('parametres' in parsed);
    if(!looksValid){
      toast("Ce fichier ne ressemble pas à une sauvegarde My School Manager.","danger");
      input.value=''; return;
    }
    confirmAction("Cette opération va remplacer TOUTES les données actuelles par celles du fichier importé. Continuer ?", function(){
      const hydrated = hydrateState(parsed);
      Object.keys(state).forEach(k=>{ delete state[k]; });
      Object.assign(state, hydrated);
      persist();
      toast("Données restaurées avec succès.","success");
      navigate('');
    });
    input.value='';
  };
  reader.readAsText(file);
}
window.handleRestoreFile = handleRestoreFile;

}

const LIVRE_FIELDS = [
  {key:'titre', label:'Titre', required:true},
  {key:'auteur', label:'Auteur'},
  {key:'editeur', label:'Éditeur'},
  {key:'categorie', label:'Catégorie (ex : Roman, Manuel scolaire, BD)'},
  {key:'isbn', label:'ISBN / Référence'},
  {key:'quantiteTotale', label:'Nombre d\'exemplaires', type:'number', required:true},
  {key:'etat', label:'État général', type:'select', options:[{value:'Bon',label:'Bon'},{value:'Passable',label:'Passable'},{value:'Mauvais',label:'Mauvais'}]}
];
function exemplairesEmpruntes(livreId){
  return state.emprunts.filter(e=>e.livreId===livreId && !e.dateRetourEffective).length;
}
function exemplairesDisponibles(livre){
  return Math.max(0, Number(livre.quantiteTotale||0) - exemplairesEmpruntes(livre.id));
}
function emprunteurNomComplet(emp){
  if(emp.emprunteurType==='enseignant') return enseignantNomComplet(emp.emprunteurId);
  if(emp.emprunteurType==='personnel'){ const p=findById('personnel', emp.emprunteurId); return p?(p.prenom+" "+p.nom):"—"; }
  return eleveNomComplet(emp.emprunteurId);
}
function empruntStatutInfo(emp){
  if(emp.dateRetourEffective) return {label:'Retourné', cls:'pill-muted'};
  if(emp.dateRetourPrevue && emp.dateRetourPrevue < todayISO()) return {label:'En retard', cls:'pill-danger'};
  return {label:'En cours', cls:'pill-warn'};
}
const EMPRUNT_FIELDS = [
  {key:'livreId', label:'Livre', type:'select', required:true, options:()=>state.livres.map(l=>({value:l.id,label:l.titre+" ("+exemplairesDisponibles(l)+" dispo.)"}))},
  {key:'emprunteurType', label:'Emprunteur — type', type:'select', required:true, options:[{value:'eleve',label:'Élève'},{value:'enseignant',label:'Enseignant'},{value:'personnel',label:'Personnel'}]},
  {key:'emprunteurId', label:'Emprunteur — nom', type:'select', required:true, options:()=>[
    ...state.eleves.map(e=>({value:e.id,label:"[Élève] "+e.prenom+" "+e.nom})),
    ...state.enseignants.map(e=>({value:e.id,label:"[Enseignant] "+e.prenom+" "+e.nom})),
    ...state.personnel.map(p=>({value:p.id,label:"[Personnel] "+p.prenom+" "+p.nom}))
  ]},
  {key:'dateEmprunt', label:'Date d\'emprunt', type:'date', required:true},
  {key:'dateRetourPrevue', label:'Date de retour prévue', type:'date', required:true},
  {key:'dateRetourEffective', label:'Date de retour effective (laisser vide si non rendu)', type:'date'}
];
window.marquerLivreRendu = function(id){
  const emp = findById('emprunts', id);
  if(!emp) return;
  emp.dateRetourEffective = todayISO();
  persist();
  toast("Livre marqué comme retourné.","success");
  renderApp();
};
RENDERERS.bibliotheque = function(){
  const tab = ui.subTab.bibliotheque || 'livres';
  const tabs = subTabsHtml('bibliotheque', [
    {id:'livres',label:'Catalogue des livres'},
    {id:'emprunts',label:'Emprunts & retours'}
  ], tab);
  if(tab==='emprunts'){
    if(state.livres.length===0){
      return tabs + emptyState('📚',"Ajoutez d'abord au moins un livre dans le catalogue.");
    }
    let list = state.emprunts.slice().sort((a,b)=>(b.dateEmprunt||'').localeCompare(a.dateEmprunt||''));
    const rows = list.map(emp=>{
      const info = empruntStatutInfo(emp);
      return `<tr>
        <td>${esc(findById('livres',emp.livreId)?.titre||'—')}</td>
        <td>${esc(emprunteurNomComplet(emp))}</td>
        <td>${fmtDate(emp.dateEmprunt)}</td>
        <td>${fmtDate(emp.dateRetourPrevue)}</td>
        <td>${emp.dateRetourEffective?fmtDate(emp.dateRetourEffective):'—'}</td>
        <td><span class="pill ${info.cls}">${esc(info.label)}</span></td>
        <td class="right">
          ${!emp.dateRetourEffective?`<button class="btn btn-sm btn-primary" onclick="marquerLivreRendu('${emp.id}')">Marquer rendu</button>`:''}
          <button class="btn btn-sm" onclick="open_emprunts_form('${emp.id}')">Modifier</button>
          <button class="btn btn-sm btn-danger" onclick="delete_emprunts_item('${emp.id}')">Supprimer</button>
        </td>
      </tr>`;
    }).join('');
    window.open_emprunts_form = function(id){
      const existing = id ? findById('emprunts', id) : null;
      const data = existing || {};
      const fieldsHtml = renderForm(EMPRUNT_FIELDS, data);
      openModal({
        title:(existing?"Modifier — ":"Ajouter — ")+"un emprunt",
        bodyHtml:`<div>${fieldsHtml}</div>`,
        footerHtml:`<button class="btn" onclick="closeModal()">Annuler</button>
                    <button class="btn btn-primary" id="save-crud-btn">Enregistrer</button>`
      });
      document.getElementById('save-crud-btn').onclick = function(){
        if(!validateForm(EMPRUNT_FIELDS)) return;
        const values = collectForm(EMPRUNT_FIELDS);
        const obj = Object.assign({}, data, values, {id: data.id || uid('emp')});
        upsert('emprunts', obj);
        closeModal();
        toast((existing?"Modifié":"Ajouté")+" avec succès.","success");
        renderApp();
      };
    };
    window.delete_emprunts_item = function(id){
      confirmAction("Supprimer cet emprunt définitivement ?", function(){
        removeById('emprunts', id);
        toast("Supprimé.","success");
        renderApp();
      });
    };
    return tabs + `
      <div class="panel">
        <div class="panel-header">
          <h2>Emprunts & retours</h2>
          <div class="toolbar"><button class="btn btn-primary" onclick="open_emprunts_form()">+ Nouvel emprunt</button></div>
        </div>
        <div class="panel-body">
          ${list.length===0 ? emptyState('📚',"Aucun emprunt enregistré.") : `
          <div class="table-scroll"><table class="data-table">
            <thead><tr><th>Livre</th><th>Emprunteur</th><th>Date emprunt</th><th>Retour prévu</th><th>Retour effectif</th><th>Statut</th><th class="right">Actions</th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>`}
        </div>
      </div>`;
  }
  return tabs + crudModule({
    key:'livres', titleSingular:"un livre", titlePlural:"Catalogue des livres", icon:"📚",
    fields:LIVRE_FIELDS,
    columns:[
      {key:'titre', label:'Titre'},
      {key:'auteur', label:'Auteur'},
      {key:'categorie', label:'Catégorie'},
      {label:'Exemplaires', render:l=>exemplairesDisponibles(l)+" / "+(l.quantiteTotale||0)+" dispo."},
      {label:'État', render:l=>l.etat?`<span class="pill ${l.etat==='Bon'?'pill-success':(l.etat==='Mauvais'?'pill-danger':'pill-warn')}">${esc(l.etat)}</span>`:'—'}
    ]
  });
};

RENDERERS.dashboard = function(){

        <div class="table-scroll"><table class="data-table">

function showPdfPreview(doc, filename, title){
  const blob = doc.output('blob');
  const url = URL.createObjectURL(blob);
  openModal({
    title: title || "Aperçu du document",
    large:true,
    bodyHtml:`<iframe class="pdf-frame" src="${url}"></iframe>`,
    footerHtml:`<button class="btn" onclick="closeModal()">Fermer</button>
                <button class="btn btn-primary" id="dl-pdf-btn">⬇ Télécharger le PDF</button>`
  });
  document.getElementById('dl-pdf-btn').onclick = function(){ saveFile(filename, doc.output('blob')); };
}
function pdfHeader(doc, subtitle){
  const et = state.parametres.etablissement;
  const pageW = doc.internal.pageSize.getWidth();
  let y = 15;
  if(et.logo){
    try{ doc.addImage(et.logo, 'JPEG', 15, 10, 20, 20); }catch(e){ try{ doc.addImage(et.logo,'PNG',15,10,20,20); }catch(e2){} }
  }
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(30,58,95);
  doc.text(et.nom||"Établissement Scolaire", pageW/2, 16, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(80,80,80);
  let infoLine = [et.adresse, et.telephone, et.email].filter(Boolean).join('  •  ');
  if(infoLine) doc.text(infoLine, pageW/2, 22, {align:'center'});
  doc.setDrawColor(201,162,39); doc.setLineWidth(0.8);
  doc.line(15, 32, pageW-15, 32);
  if(subtitle){
    doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(20,20,20);
    doc.text(subtitle, pageW/2, 40, {align:'center'});
  }
  return 46;
}
function pdfFooterSignatures(doc, y, labels){
  const pageW = doc.internal.pageSize.getWidth();
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(60,60,60);
  const n = labels.length;
  const colW = (pageW-30)/n;
  labels.forEach((lab,i)=>{
    const cx = 15 + colW*i + colW/2;
    doc.text(lab, cx, y, {align:'center'});
    doc.setDrawColor(150,150,150);
    doc.line(cx-25, y+14, cx+25, y+14);
  });
}

function buildBulletinDoc(classeId, trimestreId, eleveId){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const eleve = findById('eleves', eleveId);
  const classe = findById('classes', classeId);
  const trimestre = state.parametres.trimestres.find(t=>t.id===trimestreId);
  const rows = classementClasse(classeId, trimestreId);
  const rowEleve = rows.find(r=>r.eleve.id===eleveId);
  const effectif = rows.length;

  let y = pdfHeader(doc, "BULLETIN DE NOTES — "+(trimestre?trimestre.nom:'')+" — Année "+state.parametres.etablissement.anneeScolaire);

  doc.setFontSize(10); doc.setTextColor(20,20,20); doc.setFont('helvetica','normal');
  doc.text("Élève : "+ (eleve.prenom+" "+eleve.nom), 15, y);
  doc.text("Matricule : "+(eleve.matricule||'—'), 130, y);
  y+=6;
  doc.text("Classe : "+(classe?classe.nom:'—')+"   ("+niveauLabel(classe?.niveauId)+")", 15, y);
  doc.text("Effectif : "+effectif, 130, y);
  y+=8;

  const body = (rowEleve?rowEleve.detail:[]).map(d=>[
    d.matiere.nom,
    String(d.coefficient),
    d.moyenne===null ? '—' : d.moyenne.toFixed(2),
    d.moyenne===null ? '—' : (d.moyenne*d.coefficient).toFixed(2)
  ]);
  doc.autoTable({
    startY:y,
    head:[["Matière","Coef.","Moyenne /20","Total (Moy. x Coef.)"]],
    body:body,
    theme:'grid',
    headStyles:{fillColor:[30,58,95], textColor:255, fontStyle:'bold', fontSize:9.5},
    bodyStyles:{fontSize:9.5},
    margin:{left:15, right:15}
  });
  y = doc.lastAutoTable.finalY + 10;

  const moy = rowEleve ? rowEleve.moyenneGenerale : null;
  doc.setFillColor(247,237,205);
  doc.roundedRect(15, y-6, doc.internal.pageSize.getWidth()-30, 20, 2, 2, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(30,58,95);
  doc.text("Moyenne générale : "+(moy===null?'—':moy.toFixed(2)+"/20"), 20, y+3);
  doc.text("Rang : "+(rowEleve?rowEleve.rang:'—')+" / "+effectif, 100, y+3);
  doc.text("Mention : "+mentionFor(moy), 150, y+3);
  y += 24;

  pdfFooterSignatures(doc, y+18, ["Le Directeur", "L'Enseignant Titulaire", "Le Parent / Tuteur"]);
  doc.setFontSize(8); doc.setTextColor(140,140,140);
  doc.text("Document généré le "+fmtDate(todayISO())+" via My School Manager", 15, doc.internal.pageSize.getHeight()-8);
  return doc;
}
function genererBulletinPDF(classeId, trimestreId, eleveId){
  const doc = buildBulletinDoc(classeId, trimestreId, eleveId);
  const eleve = findById('eleves', eleveId);
  addTrialWatermark(doc);
  showPdfPreview(doc, "Bulletin_"+(eleve.matricule||eleve.nom)+".pdf", "Aperçu du bulletin");
}
function genererBulletinsClassePDF(classeId, trimestreId){
  const { jsPDF } = window.jspdf;
  const rows = classementClasse(classeId, trimestreId);
  if(rows.length===0){ toast("Aucun élève dans cette classe.","danger"); return; }
  const doc = new jsPDF({unit:'mm', format:'a4'});
  rows.forEach((r, idx)=>{
    if(idx>0) doc.addPage();
    renderBulletinPage(doc, classeId, trimestreId, r.eleve.id);
  });
  const classe = findById('classes', classeId);
  addTrialWatermark(doc);
  showPdfPreview(doc, "Bulletins_"+(classe?classe.nom:'classe')+".pdf", "Aperçu des bulletins de la classe");
}
function renderBulletinPage(doc, classeId, trimestreId, eleveId){
  const eleve = findById('eleves', eleveId);
  const classe = findById('classes', classeId);
  const trimestre = state.parametres.trimestres.find(t=>t.id===trimestreId);
  const rows = classementClasse(classeId, trimestreId);
  const rowEleve = rows.find(r=>r.eleve.id===eleveId);
  const effectif = rows.length;
  let y = pdfHeader(doc, "BULLETIN DE NOTES — "+(trimestre?trimestre.nom:'')+" — Année "+state.parametres.etablissement.anneeScolaire);
  doc.setFontSize(10); doc.setTextColor(20,20,20); doc.setFont('helvetica','normal');
  doc.text("Élève : "+ (eleve.prenom+" "+eleve.nom), 15, y);
  doc.text("Matricule : "+(eleve.matricule||'—'), 130, y);
  y+=6;
  doc.text("Classe : "+(classe?classe.nom:'—')+"   ("+niveauLabel(classe?.niveauId)+")", 15, y);
  doc.text("Effectif : "+effectif, 130, y);
  y+=8;
  const body = (rowEleve?rowEleve.detail:[]).map(d=>[
    d.matiere.nom, String(d.coefficient),
    d.moyenne===null?'—':d.moyenne.toFixed(2),
    d.moyenne===null?'—':(d.moyenne*d.coefficient).toFixed(2)
  ]);
  doc.autoTable({ startY:y, head:[["Matière","Coef.","Moyenne /20","Total (Moy. x Coef.)"]], body, theme:'grid',
    headStyles:{fillColor:[30,58,95], textColor:255, fontStyle:'bold', fontSize:9.5}, bodyStyles:{fontSize:9.5}, margin:{left:15,right:15} });
  y = doc.lastAutoTable.finalY + 10;
  const moy = rowEleve ? rowEleve.moyenneGenerale : null;
  doc.setFillColor(247,237,205);
  doc.roundedRect(15, y-6, doc.internal.pageSize.getWidth()-30, 20, 2, 2, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(30,58,95);
  doc.text("Moyenne générale : "+(moy===null?'—':moy.toFixed(2)+"/20"), 20, y+3);
  doc.text("Rang : "+(rowEleve?rowEleve.rang:'—')+" / "+effectif, 100, y+3);
  doc.text("Mention : "+mentionFor(moy), 150, y+3);
  y += 24;
  pdfFooterSignatures(doc, y+18, ["Le Directeur", "L'Enseignant Titulaire", "Le Parent / Tuteur"]);
  doc.setFontSize(8); doc.setTextColor(140,140,140);
  doc.text("Document généré le "+fmtDate(todayISO())+" via My School Manager", 15, doc.internal.pageSize.getHeight()-8);
}
window.genererBulletinPDF = genererBulletinPDF;
window.genererBulletinsClassePDF = genererBulletinsClassePDF;

function genererRecuPDF(paiementId){
  const p = findById('paiements', paiementId);
  if(!p){ toast("Paiement introuvable.","danger"); return; }
  const insc = findById('inscriptions', p.inscriptionId);
  const eleve = findById('eleves', p.eleveId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  let y = pdfHeader(doc, "REÇU DE PAIEMENT DE SCOLARITÉ");

  doc.setFontSize(10); doc.setTextColor(20,20,20); doc.setFont('helvetica','normal');
  doc.text("N° Reçu : "+p.numeroRecu, 15, y);
  doc.text("Date : "+fmtDateLong(p.date), 130, y);
  y+=10;
  doc.setDrawColor(220,220,220); doc.line(15,y,doc.internal.pageSize.getWidth()-15,y); y+=8;

  doc.text("Reçu de : "+(eleve?eleve.prenom+" "+eleve.nom:'—'), 15, y);
  doc.text("Matricule : "+(eleve?.matricule||'—'), 130, y); y+=6;
  doc.text("Classe : "+(insc?classeLabel(insc.classeId):'—'), 15, y);
  doc.text("Année scolaire : "+(insc?insc.anneeScolaire:'—'), 130, y); y+=6;
  doc.text("Mode de paiement : "+(p.mode||'—'), 15, y); y+=12;

  doc.autoTable({
    startY:y,
    head:[["Description","Montant"]],
    body:[["Versement scolarité", fmtMoney(p.montant)]],
    theme:'grid',
    headStyles:{fillColor:[30,58,95], textColor:255, fontStyle:'bold'},
    margin:{left:15,right:15}
  });
  y = doc.lastAutoTable.finalY + 8;
  doc.setFont('helvetica','italic'); doc.setFontSize(9.5);
  doc.text("Arrêté le présent reçu à la somme de : "+nombreEnLettres(p.montant)+" "+(state.parametres.etablissement.devise||'FCFA'), 15, y, {maxWidth:doc.internal.pageSize.getWidth()-30});
  y+=12;

  if(insc){
    const solde = soldeInscription(insc);
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text("Total scolarité : "+fmtMoney(insc.fraisScolariteTotal)+"   |   Total payé à ce jour : "+fmtMoney(totalPaye(insc.id))+"   |   Solde restant : "+fmtMoney(solde), 15, y, {maxWidth:doc.internal.pageSize.getWidth()-30});
    y+=14;
  }
  pdfFooterSignatures(doc, y+22, ["Le Caissier / Comptable", "Cachet de l'établissement"]);
  doc.setFontSize(8); doc.setTextColor(140,140,140);
  doc.text("Document généré le "+fmtDate(todayISO())+" via My School Manager", 15, doc.internal.pageSize.getHeight()-8);

  addTrialWatermark(doc);
  showPdfPreview(doc, "Recu_"+p.numeroRecu+".pdf", "Aperçu du reçu de paiement");
}
window.genererRecuPDF = genererRecuPDF;

function genererBonPDF(mouvementId){
  const m = findById('magasinMouvements', mouvementId);
  if(!m){ toast("Bon introuvable.","danger"); return; }
  const art = findById('magasinArticles', m.articleId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const estEntree = m.type==='entree';
  let y = pdfHeader(doc, estEntree ? "BON D'ENTRÉE MAGASIN" : "BON DE SORTIE MAGASIN");

  doc.setFontSize(10); doc.setTextColor(20,20,20); doc.setFont('helvetica','normal');
  doc.text("N° Bon : "+m.numeroBon, 15, y);
  doc.text("Date : "+fmtDateLong(m.date), 130, y);
  y+=10;
  doc.setDrawColor(220,220,220); doc.line(15,y,doc.internal.pageSize.getWidth()-15,y); y+=8;

  doc.text((estEntree?"Provenance : ":"Destination : ")+(estEntree?(m.provenance||'—'):(m.destination||'—')), 15, y);
  y+=6;
  doc.text((estEntree?"Réceptionné par : ":"Remis par : ")+(m.responsable||'—'), 15, y);
  y+=6;
  if(!estEntree && m.materielId){
    const matLie = findById('materiels', m.materielId);
    if(matLie){
      doc.text("Fiche matériel liée : "+matLie.designation+" — Détenteur : "+matLie.detenteurPrenom+" "+matLie.detenteurNom+" ("+(matLie.fonction||'—')+")", 15, y, {maxWidth:doc.internal.pageSize.getWidth()-30});
      y+=6;
    }
  }
  y+=6;

  doc.autoTable({
    startY:y,
    head:[["Article","Quantité","Unité"]],
    body:[[art?art.designation:'—', String(m.quantite), art?(art.unite||'—'):'—']],
    theme:'grid',
    headStyles:{fillColor:[30,58,95], textColor:255, fontStyle:'bold'},
    margin:{left:15,right:15}
  });
  y = doc.lastAutoTable.finalY + 10;

  if(m.observations){
    doc.setFont('helvetica','italic'); doc.setFontSize(9.5);
    doc.text("Observations : "+m.observations, 15, y, {maxWidth:doc.internal.pageSize.getWidth()-30});
    y+=14;
  }

  pdfFooterSignatures(doc, y+22, estEntree ? ["Le Magasinier","Le Fournisseur / Donateur"] : ["Le Magasinier","Le Destinataire"]);
  doc.setFontSize(8); doc.setTextColor(140,140,140);
  doc.text("Document généré le "+fmtDate(todayISO())+" via My School Manager", 15, doc.internal.pageSize.getHeight()-8);

  addTrialWatermark(doc);
  showPdfPreview(doc, (estEntree?"Bon_Entree_":"Bon_Sortie_")+m.numeroBon+".pdf", "Aperçu du bon "+(estEntree?"d'entrée":"de sortie"));
}
window.genererBonPDF = genererBonPDF;
